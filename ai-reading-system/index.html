<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1年50本书 · AI阅读执行系统</title>
<style>
  :root{
    --bg:#FAFAFC; --card:#FFFFFF; --ink:#1F2937; --sub:#6B7280; --line:#ECECF1;
    --orange:#F59E0B; --blue:#3B82F6; --green:#10B981; --rose:#FE2C55; --purple:#8B5CF6;
    --grad:linear-gradient(120deg,#F59E0B 0%,#F97316 35%,#3B82F6 100%);
    --shadow:0 8px 28px rgba(59,130,246,.10), 0 2px 8px rgba(17,24,39,.05);
    --shadow-sm:0 3px 12px rgba(17,24,39,.07);
    --r:18px; --r-sm:12px;
    --todo:#E5E7EB; --todo-t:#9CA3AF; --doing:#3B82F6; --done:#10B981;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);
    font-family:"Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.55}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#D6D9E0;border-radius:8px}

  /* ---------- Header ---------- */
  header.top{background:var(--grad);color:#fff;padding:26px 30px 22px;position:relative;overflow:hidden}
  header.top::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;
    background:radial-gradient(circle,rgba(255,255,255,.25),transparent 70%);border-radius:50%}
  .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;position:relative;z-index:1}
  .brand h1{font-size:25px;font-weight:800;letter-spacing:.5px}
  .brand p{opacity:.92;font-size:13.5px;margin-top:4px}
  .top-actions{display:flex;gap:9px;flex-wrap:wrap}
  .btn{border:none;cursor:pointer;font-weight:700;font-size:13px;border-radius:11px;padding:9px 14px;
    transition:.15s;font-family:inherit}
  .btn-ghost{background:rgba(255,255,255,.18);color:#fff}
  .btn-ghost:hover{background:rgba(255,255,255,.32)}
  .btn-light{background:#fff;color:var(--blue)}
  .btn-light:hover{filter:brightness(.96)}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-primary:hover{filter:brightness(1.07)}
  .btn-danger{background:var(--rose);color:#fff}

  /* ---------- KPI ---------- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;
    padding:0 30px;margin:-22px 0 8px;position:relative;z-index:2}
  .kpi{background:var(--card);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
  .kpi .num{font-size:30px;font-weight:850;line-height:1}
  .kpi .lbl{font-size:12.5px;color:var(--sub);margin-top:6px}
  .kpi .num.g{color:var(--green)} .kpi .num.b{color:var(--blue)} .kpi .num.o{color:var(--orange)}

  /* ---------- Distribution ---------- */
  .section-wrap{padding:18px 30px 6px}
  .sec-title{font-size:16px;font-weight:800;margin:8px 0 12px;display:flex;align-items:center;gap:8px}
  .sec-title .bar{width:5px;height:18px;background:var(--grad);border-radius:3px}
  .dist{background:var(--card);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);
    display:grid;grid-template-columns:repeat(8,1fr);gap:12px}
  .dist .col{text-align:center}
  .dist .stack{height:120px;display:flex;flex-direction:column-reverse;justify-content:flex-start;
    background:#F3F4F8;border-radius:9px;overflow:hidden;position:relative}
  .dist .fill{background:var(--blue);width:100%;transition:.3s}
  .dist .cnt{font-size:22px;font-weight:850;margin-top:8px}
  .dist .stage{font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.3}
  .dist .stage b{color:var(--ink)}
  @media(max-width:720px){.dist{grid-template-columns:repeat(4,1fr)}}

  /* ---------- Toolbar ---------- */
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 30px 6px}
  .toolbar input,.toolbar select{border:1px solid var(--line);background:#fff;border-radius:10px;
    padding:8px 12px;font-size:13px;font-family:inherit;color:var(--ink)}
  .toolbar input{flex:1;min-width:180px}
  .chip{font-size:12.5px;padding:7px 12px;border-radius:20px;border:1px solid var(--line);
    background:#fff;cursor:pointer;color:var(--sub);font-weight:600}
  .chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}

  /* ---------- Book grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:16px;padding:16px 30px 60px}
  .book{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow-sm);cursor:pointer;
    overflow:hidden;transition:.18s;border:1px solid transparent;display:flex;flex-direction:column}
  .book:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:#E6E9F2}
  .book .cover{height:74px;display:flex;align-items:center;gap:10px;padding:0 16px;color:#fff;position:relative}
  .book .cover .emoji{font-size:30px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.2))}
  .book .cover .t{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .book .body{padding:12px 14px 14px;flex:1;display:flex;flex-direction:column}
  .book .author{font-size:12px;color:var(--sub);margin-bottom:8px}
  .seg{display:flex;gap:3px;margin:6px 0 10px}
  .seg i{flex:1;height:8px;border-radius:3px;background:var(--todo);display:block}
  .seg i.doing{background:var(--doing)}
  .seg i.done{background:var(--done)}
  .book .meta{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
  .book .pct{font-size:13px;font-weight:800}
  .book .cur{font-size:11px;color:var(--sub);background:#F3F4F8;padding:3px 9px;border-radius:20px;font-weight:700}
  .badge-done{background:rgba(16,185,129,.14);color:#059669}
  .badge-doing{background:rgba(59,130,246,.14);color:#2563EB}
  .badge-todo{background:#F3F4F8;color:#9CA3AF}
  .ghost{border:2px dashed #D7DAE3;background:transparent;box-shadow:none;align-items:center;justify-content:center;
    color:var(--sub);font-weight:700;min-height:230px}
  .ghost:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-4px)}
  .ghost .plus{font-size:34px;font-weight:300;margin-bottom:6px}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(17,24,39,.5);backdrop-filter:blur(3px);
    display:none;align-items:flex-start;justify-content:center;z-index:50;padding:24px;overflow:auto}
  .overlay.show{display:flex}
  .modal{background:var(--bg);border-radius:22px;width:100%;max-width:1040px;box-shadow:0 30px 80px rgba(0,0,0,.35);
    overflow:hidden;animation:pop .2s ease}
  @keyframes pop{from{transform:scale(.97);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-head{background:var(--grad);color:#fff;padding:20px 26px;display:flex;justify-content:space-between;align-items:center}
  .modal-head h2{font-size:20px;font-weight:850}
  .modal-head .sub{opacity:.9;font-size:13px;margin-top:3px}
  .modal-head .x{background:rgba(255,255,255,.2);border:none;color:#fff;width:34px;height:34px;border-radius:10px;
    font-size:18px;cursor:pointer}
  .modal-head .x:hover{background:rgba(255,255,255,.34)}

  .stepper{display:flex;gap:6px;padding:14px 22px 4px;flex-wrap:wrap}
  .step{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:8px 11px;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--sub);transition:.15s}
  .step .dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;background:var(--todo);color:#fff}
  .step.active{color:var(--ink);border-color:var(--blue);box-shadow:0 3px 10px rgba(59,130,246,.16)}
  .step.done .dot{background:var(--done)} .step.doing .dot{background:var(--doing)}
  .step .sname{white-space:nowrap}

  .stage-body{padding:6px 26px 30px;max-height:64vh;overflow:auto}
  .stage-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 12px;
    background:#fff;border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-sm)}
  .stage-head .l{display:flex;align-items:center;gap:10px}
  .stage-head .ic{font-size:22px}
  .stage-head .nm{font-size:16px;font-weight:800}
  .stage-head .ds{font-size:12px;color:var(--sub);margin-top:2px}
  .status-sel{display:flex;gap:6px}
  .st{font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;border:1px solid var(--line);
    background:#fff;cursor:pointer;color:var(--sub)}
  .st.todo.on{background:var(--todo);color:#fff;border-color:var(--todo)}
  .st.doing.on{background:var(--doing);color:#fff;border-color:var(--doing)}
  .st.done.on{background:var(--done);color:#fff;border-color:var(--done)}

  .field{margin:12px 0}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:#374151}
  .field .hint{font-weight:500;color:var(--sub);font-size:11.5px}
  input.f,textarea.f,select.f{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;
    font-size:13.5px;font-family:inherit;color:var(--ink);background:#fff;transition:.15s}
  input.f:focus,textarea.f:focus,select.f:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
  textarea.f{resize:vertical;min-height:74px;line-height:1.55}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:640px){.two{grid-template-columns:1fr}}
  .row{display:flex;gap:10px;align-items:center}
  .row label{margin:0}

  .tbl-note{font-size:12px;color:var(--sub);background:#FFF7E6;border:1px solid #FDE68A;border-radius:10px;
    padding:9px 12px;margin:6px 0 4px}
  .md-preview{margin:-6px 0 10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto}
  .md-preview table{border-collapse:collapse;width:100%;font-size:12.5px}
  .md-preview th{background:#F1F5F9;color:#334155;padding:6px 8px;border:1px solid var(--line);text-align:left;white-space:nowrap}
  .md-preview td{padding:6px 8px;border:1px solid var(--line);vertical-align:top}
  .md-preview .mi{padding:3px 0;font-size:13px;line-height:1.55}
  .md-preview .myc{color:#B45309;background:#FEF3C7;border-radius:6px;padding:1px 6px;margin-left:4px}
  .list-head{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px}
  .list-head .tt{font-size:14px;font-weight:800}
  .add-btn{background:#EEF2FF;color:var(--blue);border:none;border-radius:9px;padding:7px 12px;font-size:12.5px;
    font-weight:700;cursor:pointer}
  .add-btn:hover{background:#E0E7FF}
  .item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px;box-shadow:var(--shadow-sm)}
  .item .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .item .top .idx{font-size:12px;font-weight:800;color:var(--sub)}
  .del{background:#FEE2E2;color:var(--rose);border:none;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:700;cursor:pointer}
  .del:hover{background:#FECACA}
  .mini{font-size:11.5px;color:var(--sub);font-weight:700;margin-bottom:4px;display:block}

  .graph-wrap{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:var(--shadow-sm)}
  .graph-wrap svg{width:100%;height:auto;display:block}
  .chain{display:flex;flex-direction:column;gap:0}
  .chain .node{background:#fff;border:1px solid var(--line);border-left:4px solid var(--orange);border-radius:11px;
    padding:10px 13px;box-shadow:var(--shadow-sm)}
  .chain .node .nl{font-weight:800;font-size:13.5px}
  .chain .node .nn{font-size:12.5px;color:var(--sub);margin-top:3px}
  .chain .arrow{text-align:center;color:var(--blue);font-size:18px;font-weight:800;padding:3px 0}

  .pub-gate{background:#FFF1F2;border:1px solid #FECDD3;border-radius:14px;padding:14px 16px;margin:14px 0}
  .pub-gate h4{color:var(--rose);font-size:14px;margin-bottom:6px}
  .pub-gate ol{margin:6px 0 0 18px;font-size:12.5px;color:#7F1D3A}
  .pub-gate ol li{margin:3px 0}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1F2937;color:#fff;
    padding:11px 20px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:99;opacity:0;transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.3)}
  .toast.show{opacity:1}

  .check{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;font-weight:600;margin:5px 14px 5px 0}
  .check input{width:17px;height:17px;accent-color:var(--blue)}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:#EEF2FF;color:var(--blue);margin:2px 4px 2px 0}
  .pill.hit{background:#ECFDF5;color:#059669}
  .empty{text-align:center;color:var(--sub);padding:30px;font-size:13px}
  .profile-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-sm);margin:10px 0}
  .kv{font-size:13px;margin:4px 0}
  .kv b{color:var(--ink)}
</style>
<style>
  /* ---------- 访问口令门（静态站：仅防随手翻，非真鉴权） ----------
     默认不显示；只有 html[data-locked] 时才显示 → 解锁只需摘掉该属性。 */
  html[data-locked] > body > *:not(#gate){display:none !important}
  #gate{display:none;position:fixed;inset:0;z-index:99999;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#F8FAFC 0%,#EEF2FF 100%);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  html[data-locked] #gate{display:flex}
  .gate-box{width:min(92vw,360px);background:#fff;border-radius:18px;padding:34px 30px;text-align:center;
    box-shadow:0 12px 40px rgba(59,130,246,.14);border:1px solid #ECECF1}
  .gate-logo{font-size:40px;line-height:1}
  .gate-box h2{font-size:20px;margin:12px 0 6px;color:#1F2937}
  .gate-sub{font-size:13px;color:#6B7280;margin-bottom:18px}
  #gate-input{width:100%;padding:11px 14px;font-size:15px;border:1px solid #E5E7EB;border-radius:10px;
    outline:none;transition:border-color .15s;text-align:center;letter-spacing:1px}
  #gate-input:focus{border-color:#3B82F6}
  .gate-box button{width:100%;margin-top:12px;padding:11px;font-size:15px;color:#fff;border:0;border-radius:10px;
    background:linear-gradient(120deg,#3B82F6,#8B5CF6);cursor:pointer;font-weight:600}
  .gate-box button:hover{filter:brightness(1.06)}
  .gate-err{font-size:12.5px;color:#DC2626;min-height:18px;margin-top:8px;line-height:1.5}
  #lockbar{position:fixed;right:14px;bottom:14px;z-index:99999;background:rgba(17,24,39,.72);color:#fff;
    font-size:12px;padding:7px 11px;border-radius:20px}
  #lockbar a{color:#fff;text-decoration:underline}
</style>
<script>
/* ===== 访问口令门：静态站仅防随手翻，非真鉴权，口令明文在此 ===== */
(function(){
  /* ↓↓↓ 部署到公网前，把下面的占位口令换成你自己的（只改这一处）↓↓↓ */
  var PASS='AIREAD2026', KEY='reading_gate_v1';
  var local=location.protocol==='file:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';
  window.__gateOn=!local;               /* 本地打开不设门，免得自己碍自己 */
  window.__gatePass=PASS;
  window.__gateReset=function(){try{localStorage.removeItem(KEY)}catch(e){}};
  window.__gateLock=function(){try{localStorage.removeItem(KEY)}catch(e){};location.reload();};
  var locked=true;
  try{if(localStorage.getItem(KEY)==='ok')locked=false}catch(e){}
  if(local)locked=false;
  if(locked)document.documentElement.setAttribute('data-locked','1');
  window.__gateUnlock=function(v){
    if(String(v||'').trim().toUpperCase()!==PASS)return false;
    try{localStorage.setItem(KEY,'ok')}catch(e){}
    document.documentElement.removeAttribute('data-locked');  /* CSS 自动把 #gate 藏起来 */
    return true;
  };
  window.__gateOpen=function(){           /*  forgot 兜底：地址栏带 #口令 直接开 */
    try{localStorage.setItem(KEY,'ok')}catch(e){}
    document.documentElement.removeAttribute('data-locked');
  };
  window.__doGate=function(){
    var i=document.getElementById('gate-input');if(!i)return;
    if(window.__gateUnlock(i.value)){
      var b=document.getElementById('lockbar');
      if(!b){b=document.createElement('div');b.id='lockbar';document.body.appendChild(b);}
      b.innerHTML='已解锁 · <a href="javascript:void(0)" onclick="__gateLock()">锁定</a>';
    }else{
      var e=document.getElementById('gate-err');if(!e)return;
      window.__gateFails=(window.__gateFails||0)+1;
      e.textContent=window.__gateFails>=3
        ? '口令不正确。若自己忘记，可在网址末尾加 #'+PASS+' 后回车即可打开。'
        : '口令不正确';
    }
  };
  document.addEventListener('DOMContentLoaded',function(){
    var i=document.getElementById('gate-input');if(!i)return;
    i.addEventListener('keydown',function(e){if(e.key==='Enter')__doGate()});
    var h=(location.hash||'').replace(/^#/,'').trim().toUpperCase();
    if(h===PASS)__gateOpen();
  });
})();
</script>
</head>
<body>
<div id="gate">
  <div class="gate-box">
    <div class="gate-logo">📚</div>
    <h2 id="gate-title">AI 阅读执行系统</h2>
    <p class="gate-sub" id="gate-sub">请输入访问口令</p>
    <input id="gate-input" type="password" placeholder="访问口令" autocomplete="off" spellcheck="false">
    <button onclick="__doGate()">进入</button>
    <p class="gate-err" id="gate-err"></p>
  </div>
</div>

<header class="top">
  <div class="top-row">
    <div class="brand">
      <h1>📚 1年50本书 · AI阅读执行系统</h1>
      <p>新书推荐 → 粗读 → 逐章拆解 → 逻辑链 → 重点推荐 → 原子笔记 → 行动清单 → 书评发布，八环闭环，进度可视化</p>
    </div>
    <div class="top-actions">
      <button class="btn btn-light" data-action="add-book">＋ 新增书籍</button>
      <button class="btn btn-ghost" data-action="profile">🎯 身份画像</button>
      <button class="btn btn-ghost" data-action="export">⬇ 导出</button>
      <button class="btn btn-ghost" data-action="import">⬆ 导入</button>
      <button class="btn btn-ghost" data-action="reset">↺ 示例</button>
    </div>
  </div>
</header>

<div class="kpis" id="kpis"></div>

<div class="section-wrap">
  <div class="sec-title"><span class="bar"></span>执行环节分布（当前所处阶段）</div>
  <div class="dist" id="dist"></div>
</div>

<div class="toolbar">
  <input id="search" placeholder="🔍 搜索书名 / 作者 / 标签…">
  <span class="chip on" data-filter="all">全部</span>
  <span class="chip" data-filter="doing">进行中</span>
  <span class="chip" data-filter="done">已完成</span>
  <span class="chip" data-filter="todo">未开始</span>
</div>

<div class="grid" id="grid"></div>

<!-- Modal container -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="file-input" accept="application/json" style="display:none">

<script src="data/state.js"></script>
<script>
/* =========================================================
   1年50本书 AI阅读执行系统  —  工作台（P0 数据外置版）
   数据唯一来源: data/state.js (window.READING_DATA)
   localStorage 仅作运行缓存 + 滚动备份
   设计语言参考「可视化拆书助手」：明亮 / 暖橙→墨蓝渐变 / Bento 卡片
   ========================================================= */

const STAGES = [
  {id:1,name:'新书推荐',icon:'📥',desc:'从豆瓣/微信读书推荐，入库并拆分章节'},
  {id:2,name:'粗读',icon:'🔍',desc:'作者信息、全书总概括、核心提炼、知识图谱'},
  {id:3,name:'逐章拆解',icon:'📑',desc:'目录与逐章拆解，补充个人理解'},
  {id:4,name:'逻辑链',icon:'🔗',desc:'生成全书逻辑链'},
  {id:5,name:'重点推荐',icon:'🎯',desc:'基于身份画像推荐重点章节，针对性阅读'},
  {id:6,name:'原子笔记',icon:'🗒️',desc:'Zettelkasten 原子笔记'},

function $(s,r=document){return r.querySelector(s)}
function $$(s,r=document){return [...r.querySelectorAll(s)]}
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function mdPreview(text){ // 把 markdown 表格/列表渲染成只读预览（跟随 textarea，编辑即所见）
  const t=(text||'').trim();if(!t)return '';
  const lines=t.split('\n').map(l=>l.trim()).filter(Boolean);
  const isRow=l=>l.startsWith('|')&&l.endsWith('|');
  let html='';
  if(lines.filter(isRow).length>=2){ // markdown 表格
    const rows=lines.filter(isRow).map(l=>l.slice(1,-1).split('|').map(c=>c.trim()));
    const head=rows[0],body=rows.slice(1).filter(r=>!r.every(c=>/^:?-{2,}:?$/.test(c)));
    html+='<div class="md-preview"><table><thead><tr>'+head.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'
      +body.map(r=>'<tr>'+head.map((_,i)=>'<td>'+esc(r[i]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
  }else{ // 列表/段落
    html='<div class="md-preview">'+lines.map(l=>{
      const m=l.match(/^(.+?)【(我的评论)】(.*)$/);
      if(m)return '<div class="mi">'+esc(m[1])+' <span class="myc">💭 '+esc('【'+m[2]+'】'+m[3])+'</span></div>';
      return '<div class="mi">'+esc(l)+'</div>';
    }).join('')+'</div>';
  }
  return html;
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}
function getPath(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o)}
function setPath(o,p,v){const ks=p.split('.');let c=o;for(let i=0;i<ks.length-1;i++){if(c[ks[i]]==null)c[ks[i]]={};c=c[ks[i]]}c[ks[ks.length-1]]=v}

/* ---------- stage status helpers ---------- */
function bookStage(book,sid){return book.stages[sid]||(book.stages[sid]={status:'todo',data:{}})}
function doneCount(book){return STAGES.filter(s=>bookStage(book,s.id).status==='done').length}
function currentStageOf(book){
  for(const s of STAGES){const st=bookStage(book,s.id).status;if(st!=='done')return s.id}
  return 8;
}
function bookProgress(book){return Math.round(doneCount(book)/8*100)}

/* ---------- persistence ---------- */
function save(){
  const json=JSON.stringify(state);
  try{
    // 滚动备份最近3版：写入前把上一版推入 _bak 链，误操作可回滚
    const prev=localStorage.getItem(STORE_KEY);
    if(prev){
      for(let i=3;i>1;i--){
        const b=localStorage.getItem(STORE_KEY+'_bak'+(i-1));
        if(b)localStorage.setItem(STORE_KEY+'_bak'+i,b);
      }
      localStorage.setItem(STORE_KEY+'_bak1',prev);
    }
    localStorage.setItem(STORE_KEY,json);
  }catch(e){
    alert('保存失败（存储空间可能已满）！请立即用工具栏"导出"备份当前数据。\n'+e.message);
  }
}
function load(){
  try{const raw=localStorage.getItem(STORE_KEY);if(raw){state=JSON.parse(raw);return true}}catch(e){}
  return false;
}

function renderKPIs(){
  const total=state.books.length;
  const doneBooks=state.books.filter(b=>doneCount(b)===8).length;
  const doingBooks=state.books.filter(b=>{const d=doneCount(b);return d>0&&d<8}).length;
  const todoBooks=state.books.filter(b=>doneCount(b)===0).length;
  const totalDone=state.books.reduce((a,b)=>a+doneCount(b),0);
  $('#kpis').innerHTML=`
    <div class="kpi"><div class="num o">${total}<span style="font-size:15px;color:var(--sub)"> / ${TOTAL_TARGET}</span></div><div class="lbl">已入库书籍（全年目标 ${TOTAL_TARGET}）</div></div>
    <div class="kpi"><div class="num g">${doneBooks}</div><div class="lbl">八环全完成</div></div>
    <div class="kpi"><div class="num b">${doingBooks}</div><div class="lbl">进行中</div></div>
    <div class="kpi"><div class="num">${todoBooks}</div><div class="lbl">未开始</div></div>
    <div class="kpi"><div class="num g">${totalDone}<span style="font-size:15px;color:var(--sub)"> / ${TOTAL_TARGET*8}</span></div><div class="lbl">累计完成环节数</div></div>`;
}
function renderDist(){
  // 当前所处阶段分布
  const counts={};STAGES.forEach(s=>counts[s.id]=0);
  state.books.forEach(b=>{counts[currentStageOf(b)]++});
  $('#dist').innerHTML=STAGES.map(s=>{
    const n=counts[s.id];const h=Math.max(6,n/ (Math.max(1,...Object.values(counts))) *100);
    return `<div class="col">
      <div class="stack"><div class="fill" style="height:${h}%"></div></div>
      <div class="cnt">${n}</div>
      <div class="stage"><b>${s.icon} ${s.name}</b><br>当前 ${n} 本</div>
    </div>`;
  }).join('');
}
function renderGrid(){
  const grid=$('#grid');
  let list=state.books.filter(b=>{
    if(filterMode==='done'&&doneCount(b)!==8)return false;
    if(filterMode==='doing'&&!(doneCount(b)>0&&doneCount(b)<8))return false;
    if(filterMode==='todo'&&doneCount(b)!==0)return false;
    if(searchText){const t=searchText.toLowerCase();const hay=(b.title+b.author+(b.tags||[]).join('')).toLowerCase();if(!hay.includes(t))return false;}
    return true;
  });
  let html='';
  list.forEach(b=>{
    const cs=currentStageOf(b);const csName=cs===8&&doneCount(b)===8?'全部完成':STAGES[cs-1].name;
    const pct=bookProgress(b);
    const seg=STAGES.map(s=>{const st=bookStage(b,s.id).status;return `<i class="${st}"></i>`}).join('');
    const curCls=doneCount(b)===8?'badge-done':(doneCount(b)>0?'badge-doing':'badge-todo');
    html+=`<div class="book" data-action="open-book" data-id="${b.id}">
      <div class="cover" style="background:linear-gradient(120deg,${b.coverColor},${shade(b.coverColor,-18)})">
        <span class="emoji">${b.coverEmoji||'📖'}</span><span class="t">${esc(b.title)}</span>
      </div>
      <div class="body">
        <div class="author">${esc(b.author||'未知作者')}</div>
        <div class="seg">${seg}</div>
        <div class="meta">
          <span class="pct" style="color:${pct===100?'var(--green)':'var(--blue)'}">${pct}%</span>
          <span class="cur ${curCls}">${doneCount(b)===8?'✅ 全完成':('阶段'+cs+'·'+csName)}</span>
        </div>
      </div></div>`;
  });
  // ghost slots up to target
  const ghosts=Math.max(0,TOTAL_TARGET-state.books.length);
  for(let i=0;i<ghosts;i++){
    html+=`<div class="book ghost" data-action="add-book"><div class="plus">＋</div><div>待入库（${state.books.length+i+1}/${TOTAL_TARGET}）</div></div>`;
  }
  if(list.length===0&&ghosts===0)html='<div class="empty">还没有符合筛选条件的书，点击右上角「新增书籍」开始。</div>';
  grid.innerHTML=html;
}
function shade(hex,p){ // lighten/darken hex
  if(!hex||typeof hex!=='string'||!/^#[0-9a-fA-F]{6}$/.test(hex))hex='#64748B'; // fallback slate
  const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.max(0,Math.min(255,r+p));g=Math.max(0,Math.min(255,g+p));b=Math.max(0,Math.min(255,b+p));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

/* ----- generic array editor ----- */
function arrEditor(arr,fields,arrKey,addLabel,sid){
  // arrKey e.g. 'stages.1.data.chapters'
  let h=`<div class="list-head"><span class="tt">📋 共 ${arr.length} 项</span><button class="add-btn" data-action="arr-add" data-key="${arrKey}" data-sid="${sid}">＋ ${addLabel}</button></div>`;
  if(arr.length===0)h+='<div class="empty">暂无条目，点击上方按钮添加。</div>';
  arr.forEach((it,i)=>{
    h+=`<div class="item"><div class="top"><span class="idx">#${i+1}</span><button class="del" data-action="arr-del" data-key="${arrKey}" data-i="${i}" data-sid="${sid}">删除</button></div>`;
    fields.forEach(f=>{
      const path=`${arrKey}.${i}.${f.name}`;
      if(f.type==='textarea')h+=`<div class="field"><span class="mini">${f.label}</span><textarea class="f" data-field="${path}" placeholder="${f.ph||''}">${esc(it[f.name])}</textarea></div>`;
      else if(f.type==='select')h+=`<div class="field"><span class="mini">${f.label}</span><select class="f" data-field="${path}">${f.options.map(o=>`<option ${it[f.name]===o?'selected':''}>${o}</option>`).join('')}</select></div>`;
      else h+=`<div class="field"><span class="mini">${f.label}</span><input class="f" data-field="${path}" value="${esc(it[f.name])}" placeholder="${f.ph||''}"></div>`;
    });
    h+=`</div>`;
  });
  return h;
}

    <input class="f" data-field="stages.2.data.graph.edges.${i}.relation" value="${esc(e.relation)}" placeholder="关系：支持/反驳/延伸/应用"></div>

function graphSVG(graph){
  const nodes=graph.nodes||[];const edges=graph.edges||[];
  if(nodes.length===0)return '<div class="empty">暂无症状图谱节点，添加节点与关联后自动绘制。</div>';
  const W=680,H=320,cx=W/2,cy=H/2,R=Math.min(W,H)/2-50;
  const pos=nodes.map((n,i)=>{const a=-Math.PI/2+i*2*Math.PI/nodes.length;return {x:cx+R*Math.cos(a),y:cy+R*Math.sin(a),n}});
  const colorOf=t=>({book:'#3B82F6',concept:'#F59E0B',project:'#10B981',person:'#8B5CF6'}[t]||'#6B7280');
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><defs></defs>`;
  edges.forEach(e=>{const a=pos[e.from],b=pos[e.to];if(!a||!b)return;svg+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#CBD5E1" stroke-width="2"/><text x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2-4}" font-size="10" fill="#94A3B8" text-anchor="middle">${esc(e.relation||'')}</text>`});
  pos.forEach(p=>{const c=colorOf(p.n.type);svg+=`<circle cx="${p.x}" cy="${p.y}" r="22" fill="${c}" opacity="0.92"/><text x="${p.x}" y="${p.y+4}" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">${esc((p.n.label||'').slice(0,4))}</text><text x="${p.x}" y="${p.y+38}" font-size="11" fill="#374151" text-anchor="middle">${esc(p.n.label||'')}</text>`});
  svg+=`</svg>`;return svg;
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-action]');
  if(!t)return;
  const a=t.dataset.action;
  if(a==='close'){$('#overlay').classList.remove('show');renderAll();return;}
  if(a==='add-book'){openAddBook();return;}
  if(a==='profile'){openProfile();return;}
  if(a==='export'){exportData();return;}
  if(a==='import'){$('#file-input').click();return;}
  if(a==='reset'){if(confirm('重置为示例数据？当前数据将被覆盖。')){state=demoData();save();renderAll();toast('已重置为示例数据')}return;}
  if(a==='open-book'){openBook(t.dataset.id);return;}
  if(a==='goto-stage'){currentStage=+t.dataset.sid;renderModal();return;}
  if(a==='set-status'){const b=getBook();b.stages[currentStage].status=t.dataset.v;save();renderStage();renderAll();return;}
  if(a==='arr-add'){const key=t.dataset.key;const arr=getPath(getBook(),key);if(!arr)return;arr.push({});save();renderStage();return;}
  if(a==='arr-del'){const key=t.dataset.key;const arr=getPath(getBook(),key);arr.splice(+t.dataset.i,1);save();renderStage();return;}
  if(a==='chain-pop'){const arr=getPath(getBook(),'stages.4.data.chain');arr.pop();save();renderStage();return;}
  if(a==='import-chapters'){const src=(getBook().stages[1].data.chapters||[]).map(c=>({title:c.title,level:'1',importance:'🟡辅助',summary:'',personal:'',tags:''}));getBook().stages[3].data.chapters=src;save();renderStage();toast('已从入库章节导入 '+src.length+' 章');return;}
  if(a==='graph-add-node'){const g=getBook().stages[2].data.graph;g.nodes=g.nodes||[];g.nodes.push({label:'新节点',type:'concept'});save();renderStage();return;}
  if(a==='graph-del-node'){const g=getBook().stages[2].data.graph;g.nodes.splice(+t.dataset.i,1);g.edges=g.edges.filter(x=>x.from!==+t.dataset.i&&x.to!==+t.dataset.i).map(x=>({from:x.from>+t.dataset.i?x.from-1:x.from,to:x.to>+t.dataset.i?x.to-1:x.to,relation:x.relation}));save();renderStage();return;}
  if(a==='graph-add-edge'){const g=getBook().stages[2].data.graph;g.edges=g.edges||[];if((g.nodes||[]).length<2){toast('至少需要2个节点');return}g.edges.push({from:0,to:1,relation:'关联'});save();renderStage();return;}
  if(a==='graph-del-edge'){const g=getBook().stages[2].data.graph;g.edges.splice(+t.dataset.i,1);save();renderStage();return;}
  if(a==='card-add'){const cards=getBook().stages[6].data.cards;cards.push({id:today()+'-'+String(cards.length+1).padStart(3,'0'),type:'概念卡',concept:'',oneLiner:'',points:'',content:'',source:'',links:'',tags:'',myThought:''});save();renderStage();return;}
  if(a==='card-del'){getBook().stages[6].data.cards.splice(+t.dataset.i,1);save();renderStage();return;}
  if(a==='action-add'){getBook().stages[7].data.actions.push({content:'',priority:'P1',done:false});save();renderStage();return;}
  if(a==='action-del'){getBook().stages[7].data.actions.splice(+t.dataset.i,1);save();renderStage();return;}
  if(a==='action-toggle'){const i=+t.dataset.i;getBook().stages[7].data.actions[i].done=t.checked;save();return;}
  if(a==='key-toggle'){const title=t.dataset.title;const rec=getBook().stages[5].data;rec.recommended=rec.recommended||[];let r=rec.recommended.find(x=>x.title===title);if(t.checked){if(!r){r={title,isKey:true,rationale:''};rec.recommended.push(r)}else r.isKey=true;}else{if(r)r.isKey=false;}save();return;}
  if(a==='key-note'){/* handled on input */}
  if(a==='pub-check'){const k=t.dataset.k;const d8=getBook().stages[8].data;if(k==='hitScore'){d8.hitScore=t.checked?'85':'';}else{d8[k]=t.checked;}save();return;}
  if(a==='pub-status'){getBook().stages[8].data.publishStatus=t.dataset.v;save();renderStage();return;}
  if(a==='pub-confirm'){openPubConfirm();return;}
});

document.addEventListener('input',e=>{
  const el=e.target.closest('[data-field]');
  if(el){const b=getBook();if(!b)return;setPath(b,el.dataset.field,el.type==='checkbox'?el.checked:el.value);save();return;}
  // Stage 5 重点章节「针对性阅读」理由
  const kn=e.target.closest('[data-action="key-note"]');
  if(kn){const b=getBook();if(!b)return;const rec=b.stages[5].data;rec.recommended=rec.recommended||[];
    let r=rec.recommended.find(x=>x.title===kn.dataset.title);
    if(!r){r={title:kn.dataset.title,isKey:false,rationale:''};rec.recommended.push(r);}
    r.rationale=kn.value;save();}
});
// checkbox change within stage5 key-toggle is click-handled; checkbox for key handled above.

function getBook(){return state.books.find(x=>x.id===currentBookId)}

/* ---- add book modal ---- */
function openAddBook(){
  $('#modal').innerHTML=`
    <div class="modal-head"><div><h2>＋ 新增书籍（进入环节1·新书推荐）</h2><div class="sub">推荐 → 入库 → 拆分章节</div></div><button class="x" data-action="close">✕</button></div>
    <div class="stage-body">
      <div class="field"><label>书名 *</label><input class="f" id="nb-title" placeholder="例如：置身事内"></div>
      <div class="field"><label>作者</label><input class="f" id="nb-author" placeholder="作者名"></div>
      <div class="field"><label>推荐来源</label><select class="f" id="nb-source"><option>豆瓣</option><option>微信读书</option><option>朋友推荐</option><option>其他</option></select></div>
      <div class="field"><label>标签（逗号分隔）</label><input class="f" id="nb-tags" placeholder="经济学,政策,中国"></div>
      <div class="field"><label>推荐理由</label><textarea class="f" id="nb-reason" placeholder="为什么想读这本？"></textarea></div>
      <button class="btn btn-primary" style="width:100%;padding:12px" id="nb-save">入库并进入拆解流</button>
    </div>`;
  $('#overlay').classList.add('show');
  $('#nb-save').onclick=()=>{
    const title=$('#nb-title').value.trim();if(!title){toast('请填写书名');return;}
    const b=mkBook(title,$('#nb-author').value.trim(),PALETTE[state.books.length%PALETTE.length],'📖',$('#nb-source').value,(($('#nb-tags').value)||'').split(/[,，]/).map(s=>s.trim()).filter(Boolean),[]);
    b.stages[1]={status:'doing',data:{source:$('#nb-source').value,recommender:'',reason:$('#nb-reason').value,libraryStatus:'未入库',ebookChecked:false,ebookDownloaded:false,ebookFormat:'',chapters:[]}};
    state.books.unshift(b);save();
    toast('已入库：'+title);openBook(b.id);
  };
}

/* ---- profile modal ---- */
function openProfile(){
  const p=state.profile;
  $('#modal').innerHTML=`
    <div class="modal-head"><div><h2>🎯 身份画像</h2><div class="sub">驱动阶段5「重点章节推荐」</div></div><button class="x" data-action="close">✕</button></div>
    <div class="stage-body">
      <div class="field"><label>称呼</label><input class="f" id="pf-name" value="${esc(p.name)}"></div>
      <div class="field"><label>身份角色（每行一个）</label><textarea class="f" id="pf-roles" placeholder="知识工作者">${(p.roles||[]).join('\n')}</textarea></div>
      <div class="field"><label>阅读目标（每行一个）</label><textarea class="f" id="pf-goals">${(p.goals||[]).join('\n')}</textarea></div>
      <div class="field"><label>兴趣主题标签（逗号分隔，用于匹配章节）</label><input class="f" id="pf-interests" value="${(p.interests||[]).join(',')}" placeholder="心理学,决策,商业"></div>
      <div class="field"><label>阅读用途</label><input class="f" id="pf-purpose" value="${esc(p.purpose)}"></div>
      <button class="btn btn-primary" style="width:100%;padding:12px" id="pf-save">保存画像</button>
    </div>`;
  $('#overlay').classList.add('show');
  $('#pf-save').onclick=()=>{
    state.profile={name:$('#pf-name').value.trim(),roles:$('#pf-roles').value.split('\n').map(s=>s.trim()).filter(Boolean),goals:$('#pf-goals').value.split('\n').map(s=>s.trim()).filter(Boolean),interests:$('#pf-interests').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean),purpose:$('#pf-purpose').value.trim()};
    save();toast('身份画像已保存');renderAll();
  };
}

/* ---- publish confirm gate ---- */
function openPubConfirm(){
  const b=getBook();const d=b.stages[8].data;
  $('#modal').innerHTML=`
    <div class="modal-head"><div><h2>📣 发布确认（必经网关）</h2><div class="sub">《${esc(b.title)}》书评</div></div><button class="x" data-action="close">✕</button></div>
    <div class="stage-body">
      <div class="pub-gate"><h4>确认以下均已满足：</h4>
        <label class="check"><input type="checkbox" id="c1"> 已去AI味，保住个人人格</label>
        <label class="check"><input type="checkbox" id="c2"> 爆款量化 ≥ 85 分（数据类 ≥70）</label>
        <label class="check"><input type="checkbox" id="c3"> 封面+内图已生成并QA、朱红排版校验通过</label>
        <label class="check"><input type="checkbox" id="c4"> 出口IP已在微信白名单、发布前终检通过</label>
      </div>
      <div class="field"><label>发布后 media_id（可选，发布成功回填）</label><input class="f" id="pm-id" value="${esc(d.mediaId||'')}" placeholder="发布成功返回的 media_id"></div>
      <button class="btn btn-primary" style="width:100%;padding:13px" id="pm-do">✅ 确认发布（标记为已发布 + 归档）</button>
      <div class="tbl-note" style="margin-top:12px">说明：本工作台只负责状态流转与记录。实际发布请用你自己的发布工具（如公众号发布技能的 API 通道）：先备好封面图取 <code>thumb_media_id</code>，确认无误后再发出；<b>发布动作必须经用户确认</b>。完成后把 <code>media_id</code> 回填至此，状态即流转为「已发布」。</div>
    </div>`;
  $('#pm-do').onclick=()=>{
    if(!($('#c1').checked&&$('#c2').checked&&$('#c3').checked&&$('#c4').checked)){toast('请先勾选全部确认项');return;}
    d.publishStatus='已发布';d.publishDate=today();d.mediaId=$('#pm-id').value.trim()||d.mediaId||'待回填';
    d.archived=true;save();toast('已标记为已发布');renderStage();renderAll();
  };
}

/* ---- export / import ---- */
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='reading-system-'+today()+'.json';a.click();toast('已导出 JSON');
}
$('#file-input').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{state=JSON.parse(r.result);save();renderAll();toast('导入成功');$('#overlay').classList.remove('show');}catch(err){toast('导入失败：文件格式错误')} };
  r.readAsText(f);e.target.value='';
});

/* ---- toolbar ---- */
$('#search').addEventListener('input',e=>{searchText=e.target.value;renderGrid();});
$$('.chip').forEach(c=>c.addEventListener('click',()=>{$$('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');filterMode=c.dataset.filter;renderGrid();}));
// delegate chip clicks inside dynamic? chips are static in toolbar, fine.

/* ---- init ---- */
const DATA_VERSION=8; // v8=迁移语义升级：state.js 是唯一真相，版本升级时整体重播种（localStorage 只是缓存，不再合并保留）；v7=修复迁移：版本号一致但内容缺深化卡/对比分析时也强制刷新演示书；v6=冀石雨借鉴
function demoStale(state){ // 内容完整性检查：内置书存在但缺关键字段 → 视为旧数据
  const f=(state.books||[]).find(b=>b.title==='财务自由之路');
  if(!f)return false;
  const chs=(f.stages&&f.stages[3]&&f.stages[3].data&&f.stages[3].data.chapters)||[];
  const s2=(f.stages&&f.stages[2]&&f.stages[2].data)||{};
  return !chs.some(c=>c.deepCard)||!s2.contrast||!s2.sixDims;
}
if(!load()||!state.books||state.books.length===0){state=demoData();state.version=DATA_VERSION;save();}
else if((state.version||0)<DATA_VERSION||demoStale(state)){
  // 版本迁移：data/state.js 是唯一真相，整体重播种（v8 起 localStorage 仅作缓存，不再合并保留旧浏览器数据）
  state=demoData();state.version=DATA_VERSION;save();
}
renderAll();
</script>
