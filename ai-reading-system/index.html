<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1年50本书 · AI阅读执行系统</title>
<style>
  :root{
    --bg:#FAFAFC; --card:#FFFFFF; --ink:#1F2937; --sub:#6B7280; --line:#ECECF1;
    --orange:#F59E0B; --blue:#3B82F6; --green:#10B981; --rose:#FE2C55; --purple:#8B5CF6;
    --grad:linear-gradient(120deg,#F59E0B 0%,#F97316 35%,#3B82F6 100%);
    --shadow:0 8px 28px rgba(59,130,246,.10), 0 2px 8px rgba(17,24,39,.05);
    --shadow-sm:0 3px 12px rgba(17,24,39,.07);
    --r:18px; --r-sm:12px;
    --todo:#E5E7EB; --todo-t:#9CA3AF; --doing:#3B82F6; --done:#10B981;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);
    font-family:"Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.55}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#D6D9E0;border-radius:8px}

  /* ---------- Header ---------- */
  header.top{background:var(--grad);color:#fff;padding:26px 30px 22px;position:relative;overflow:hidden}
  header.top::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;
    background:radial-gradient(circle,rgba(255,255,255,.25),transparent 70%);border-radius:50%}
  .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;position:relative;z-index:1}
  .brand h1{font-size:25px;font-weight:800;letter-spacing:.5px}
  .brand p{opacity:.92;font-size:13.5px;margin-top:4px}
  .top-actions{display:flex;gap:9px;flex-wrap:wrap}
  .btn{border:none;cursor:pointer;font-weight:700;font-size:13px;border-radius:11px;padding:9px 14px;
    transition:.15s;font-family:inherit}
  .btn-ghost{background:rgba(255,255,255,.18);color:#fff}
  .btn-ghost:hover{background:rgba(255,255,255,.32)}
  .btn-light{background:#fff;color:var(--blue)}
  .btn-light:hover{filter:brightness(.96)}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-primary:hover{filter:brightness(1.07)}
  .btn-danger{background:var(--rose);color:#fff}

  /* ---------- KPI ---------- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;
    padding:0 30px;margin:-22px 0 8px;position:relative;z-index:2}
  .kpi{background:var(--card);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
  .kpi .num{font-size:30px;font-weight:850;line-height:1}
  .kpi .lbl{font-size:12.5px;color:var(--sub);margin-top:6px}
  .kpi .num.g{color:var(--green)} .kpi .num.b{color:var(--blue)} .kpi .num.o{color:var(--orange)}

  /* ---------- Distribution ---------- */
  .section-wrap{padding:18px 30px 6px}
  .sec-title{font-size:16px;font-weight:800;margin:8px 0 12px;display:flex;align-items:center;gap:8px}
  .sec-title .bar{width:5px;height:18px;background:var(--grad);border-radius:3px}
  .dist{background:var(--card);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);
    display:grid;grid-template-columns:repeat(8,1fr);gap:12px}
  .dist .col{text-align:center}
  .dist .stack{height:120px;display:flex;flex-direction:column-reverse;justify-content:flex-start;
    background:#F3F4F8;border-radius:9px;overflow:hidden;position:relative}
  .dist .fill{background:var(--blue);width:100%;transition:.3s}
  .dist .cnt{font-size:22px;font-weight:850;margin-top:8px}
  .dist .stage{font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.3}
  .dist .stage b{color:var(--ink)}
  @media(max-width:720px){.dist{grid-template-columns:repeat(4,1fr)}}

  /* ---------- Toolbar ---------- */
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 30px 6px}
  .toolbar input,.toolbar select{border:1px solid var(--line);background:#fff;border-radius:10px;
    padding:8px 12px;font-size:13px;font-family:inherit;color:var(--ink)}
  .toolbar input{flex:1;min-width:180px}
  .chip{font-size:12.5px;padding:7px 12px;border-radius:20px;border:1px solid var(--line);
    background:#fff;cursor:pointer;color:var(--sub);font-weight:600}
  .chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}

  /* ---------- Book grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:16px;padding:16px 30px 60px}
  .book{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow-sm);cursor:pointer;
    overflow:hidden;transition:.18s;border:1px solid transparent;display:flex;flex-direction:column}
  .book:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:#E6E9F2}
  .book .cover{height:74px;display:flex;align-items:center;gap:10px;padding:0 16px;color:#fff;position:relative}
  .book .cover .emoji{font-size:30px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.2))}
  .book .cover .t{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .book .body{padding:12px 14px 14px;flex:1;display:flex;flex-direction:column}
  .book .author{font-size:12px;color:var(--sub);margin-bottom:8px}
  .seg{display:flex;gap:3px;margin:6px 0 10px}
  .seg i{flex:1;height:8px;border-radius:3px;background:var(--todo);display:block}
  .seg i.doing{background:var(--doing)}
  .seg i.done{background:var(--done)}
  .book .meta{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
  .book .pct{font-size:13px;font-weight:800}
  .book .cur{font-size:11px;color:var(--sub);background:#F3F4F8;padding:3px 9px;border-radius:20px;font-weight:700}
  .badge-done{background:rgba(16,185,129,.14);color:#059669}
  .badge-doing{background:rgba(59,130,246,.14);color:#2563EB}
  .badge-todo{background:#F3F4F8;color:#9CA3AF}
  .ghost{border:2px dashed #D7DAE3;background:transparent;box-shadow:none;align-items:center;justify-content:center;
    color:var(--sub);font-weight:700;min-height:230px}
  .ghost:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-4px)}
  .ghost .plus{font-size:34px;font-weight:300;margin-bottom:6px}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(17,24,39,.5);backdrop-filter:blur(3px);
    display:none;align-items:flex-start;justify-content:center;z-index:50;padding:24px;overflow:auto}
  .overlay.show{display:flex}
  .modal{background:var(--bg);border-radius:22px;width:100%;max-width:1040px;box-shadow:0 30px 80px rgba(0,0,0,.35);
    overflow:hidden;animation:pop .2s ease}
  @keyframes pop{from{transform:scale(.97);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-head{background:var(--grad);color:#fff;padding:20px 26px;display:flex;justify-content:space-between;align-items:center}
  .modal-head h2{font-size:20px;font-weight:850}
  .modal-head .sub{opacity:.9;font-size:13px;margin-top:3px}
  .modal-head .x{background:rgba(255,255,255,.2);border:none;color:#fff;width:34px;height:34px;border-radius:10px;
    font-size:18px;cursor:pointer}
  .modal-head .x:hover{background:rgba(255,255,255,.34)}

  .stepper{display:flex;gap:6px;padding:14px 22px 4px;flex-wrap:wrap}
  .step{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:8px 11px;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--sub);transition:.15s}
  .step .dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;background:var(--todo);color:#fff}
  .step.active{color:var(--ink);border-color:var(--blue);box-shadow:0 3px 10px rgba(59,130,246,.16)}
  .step.done .dot{background:var(--done)} .step.doing .dot{background:var(--doing)}
  .step .sname{white-space:nowrap}

  .stage-body{padding:6px 26px 30px;max-height:64vh;overflow:auto}
  #stage-head-out{padding:0 26px}
  #stage-head-out .stage-head{margin:16px 0 4px}
  .stage-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 12px;
    background:#fff;border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-sm)}
  .stage-head .l{display:flex;align-items:center;gap:10px}
  .stage-head .ic{font-size:22px}
  .stage-head .nm{font-size:16px;font-weight:800}
  .stage-head .ds{font-size:12px;color:var(--sub);margin-top:2px}
  .status-sel{display:flex;gap:6px}
  .st{font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;border:1px solid var(--line);
    background:#fff;cursor:pointer;color:var(--sub)}
  .st.todo.on{background:var(--todo);color:#fff;border-color:var(--todo)}
  .st.doing.on{background:var(--doing);color:#fff;border-color:var(--doing)}
  .st.done.on{background:var(--done);color:#fff;border-color:var(--done)}

  .field{margin:12px 0}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:#374151}
  .field .hint{font-weight:500;color:var(--sub);font-size:11.5px}
  input.f,textarea.f,select.f{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;
    font-size:13.5px;font-family:inherit;color:var(--ink);background:#fff;transition:.15s}
  input.f:focus,textarea.f:focus,select.f:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
  textarea.f{resize:vertical;min-height:74px;line-height:1.55}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:640px){.two{grid-template-columns:1fr}}
  .row{display:flex;gap:10px;align-items:center}
  .row label{margin:0}

  .tbl-note{font-size:12px;color:var(--sub);background:#FFF7E6;border:1px solid #FDE68A;border-radius:10px;
    padding:9px 12px;margin:6px 0 4px}
  .md-preview{margin:-6px 0 10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto}
  .md-preview table{border-collapse:collapse;width:100%;font-size:12.5px}
  .md-preview th{background:#F1F5F9;color:#334155;padding:6px 8px;border:1px solid var(--line);text-align:left;white-space:nowrap}
  .md-preview td{padding:6px 8px;border:1px solid var(--line);vertical-align:top}
  .md-preview .mi{padding:3px 0;font-size:13px;line-height:1.55}
  .md-preview .myc{color:#B45309;background:#FEF3C7;border-radius:6px;padding:1px 6px;margin-left:4px}
  .list-head{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px}
  .list-head .tt{font-size:14px;font-weight:800}
  .add-btn{background:#EEF2FF;color:var(--blue);border:none;border-radius:9px;padding:7px 12px;font-size:12.5px;
    font-weight:700;cursor:pointer}
  .add-btn:hover{background:#E0E7FF}
  .item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px;box-shadow:var(--shadow-sm)}
  .item .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .item .top .idx{font-size:12px;font-weight:800;color:var(--sub)}
  .del{background:#FEE2E2;color:var(--rose);border:none;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:700;cursor:pointer}
  .del:hover{background:#FECACA}
  .mini{font-size:11.5px;color:var(--sub);font-weight:700;margin-bottom:4px;display:block}

  .graph-wrap{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:var(--shadow-sm)}
  .graph-wrap svg{width:100%;height:auto;display:block}
  .chain{display:flex;flex-direction:column;gap:0}
  .chain .node{background:#fff;border:1px solid var(--line);border-left:4px solid var(--orange);border-radius:11px;
    padding:10px 13px;box-shadow:var(--shadow-sm)}
  .chain .node .nl{font-weight:800;font-size:13.5px}
  .chain .node .nn{font-size:12.5px;color:var(--sub);margin-top:3px}
  .chain .arrow{text-align:center;color:var(--blue);font-size:18px;font-weight:800;padding:3px 0}

  .pub-gate{background:#FFF1F2;border:1px solid #FECDD3;border-radius:14px;padding:14px 16px;margin:14px 0}
  .pub-gate h4{color:var(--rose);font-size:14px;margin-bottom:6px}
  .pub-gate ol{margin:6px 0 0 18px;font-size:12.5px;color:#7F1D3A}
  .pub-gate ol li{margin:3px 0}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1F2937;color:#fff;
    padding:11px 20px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:99;opacity:0;transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.3)}
  .toast.show{opacity:1}

  .check{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;font-weight:600;margin:5px 14px 5px 0}
  .check input{width:17px;height:17px;accent-color:var(--blue)}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:#EEF2FF;color:var(--blue);margin:2px 4px 2px 0}
  .pill.hit{background:#ECFDF5;color:#059669}
  .empty{text-align:center;color:var(--sub);padding:30px;font-size:13px}
  .profile-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-sm);margin:10px 0}
  .kv{font-size:13px;margin:4px 0}
  .kv b{color:var(--ink)}

  /* =====================================================
     P0 移动端优化（2026-10-01）
     原则：全部 override，桌面端零影响；≤768px 生效
     ===================================================== */
  @media(max-width:768px){
    body{font-size:16px;line-height:1.65}
    header.top{padding:18px 16px 14px}
    .brand h1{font-size:19px}
    .brand p{font-size:13px}
    .top-actions{display:none}                    /* 操作收纳进「我的」Tab */
    .kpis{padding:0 14px;gap:10px;grid-template-columns:repeat(2,1fr);margin:-18px 0 6px}
    .kpi{padding:12px 14px}
    .kpi .num{font-size:24px}
    .kpi .lbl{font-size:12px}
    .kpi:nth-child(5){display:none}               /* 手机首屏减负，统计见「我的」 */
    .section-wrap{padding:12px 14px 4px}
    .sec-title{font-size:15px}
    .dist{grid-template-columns:repeat(4,1fr);gap:8px;padding:12px}
    .dist .stack{height:72px}
    .dist .cnt{font-size:17px}
    .dist .stage{font-size:11px}
    .toolbar{padding:10px 14px 4px;gap:8px}
    .toolbar input{font-size:16px;padding:11px 12px} /* 16px 防 iOS 聚焦自动放大 */
    .chip{font-size:13px;padding:10px 14px;min-height:40px;display:inline-flex;align-items:center}
    .grid{grid-template-columns:1fr;gap:12px;padding:12px 14px calc(80px + env(safe-area-inset-bottom))}
    .book .cover{height:64px}
    .ghost{min-height:120px}
    /* 弹窗全屏化 */
    .overlay{padding:0;align-items:stretch}
    .modal{max-width:none;border-radius:0;min-height:100vh}
    .modal-head{padding:14px 16px;position:sticky;top:0;z-index:5}
    .modal-head h2{font-size:17px}
    .modal-head .x{width:40px;height:40px}
    .stepper{flex-wrap:nowrap;overflow-x:auto;padding:10px 14px 4px;-webkit-overflow-scrolling:touch}
    .step{padding:9px 12px;font-size:13px;min-height:44px;flex:none}
    .stage-body{padding:4px 14px calc(34px + env(safe-area-inset-bottom));max-height:none}
    .stage-head{flex-direction:column;align-items:flex-start;gap:10px}
    .btn,.add-btn{min-height:44px;font-size:14px;padding:11px 16px}
    input.f,textarea.f,select.f{font-size:16px;padding:12px}  /* 防 iOS 缩放 */
    .st{font-size:13px;padding:9px 14px;min-height:40px}
    .del{min-height:36px;padding:8px 12px;font-size:13px}
    .md-preview table{font-size:13.5px}
    .md-preview th,.md-preview td{padding:7px 9px}
    .check{font-size:15px;padding:6px 0;min-height:44px;align-items:center}
    .check input{width:20px;height:20px}
    .mini{font-size:12.5px}
    .field label{font-size:14px}
    .tbl-note{font-size:13px}
    .toast{bottom:calc(74px + env(safe-area-inset-bottom))}
  }

  /* 底部 Tab（仅 ≤768px 显示） */
  #tabbar{display:none}
  @media(max-width:768px){
    #tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;
      border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
      box-shadow:0 -4px 18px rgba(17,24,39,.08)}
    #tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
      padding:8px 0 6px;font-size:11px;color:var(--sub);font-weight:700;cursor:pointer;
      min-height:54px;justify-content:center;border:none;background:none;font-family:inherit}
    #tabbar .tab .ti{font-size:19px;line-height:1}
    #tabbar .tab.on{color:var(--blue)}
  }

  /* 聚合视图（Tab 页） */
  #aggview{padding:14px 14px calc(84px + env(safe-area-inset-bottom))}
  .agg-book{background:#fff;border-radius:var(--r-sm);box-shadow:var(--shadow-sm);padding:12px 14px;margin-bottom:12px}
  .agg-book .bt{font-weight:800;font-size:15px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .agg-book .bt .pc{font-size:12px;color:var(--sub);font-weight:700;white-space:nowrap}
  .agg-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .agg-step{border:1px solid var(--line);border-radius:10px;padding:9px 6px;text-align:center;font-size:12px;
    color:var(--sub);background:#FAFAFC;cursor:pointer;min-height:44px}
  .agg-step.done{background:#ECFDF5;border-color:#A7F3D0;color:#059669}
  .agg-step.doing{background:#EFF6FF;border-color:#BFDBFE;color:#2563EB}
  .agg-filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .note-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow-sm)}
  .note-card .nh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
  .note-card .nt{font-weight:800;font-size:15px}
  .note-card .tp{font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;background:#EEF2FF;color:var(--blue);white-space:nowrap}
  .note-card .ol{font-size:14px;margin:4px 0}
  .note-card .pt{font-size:13px;color:var(--sub);white-space:pre-line}
  .note-card .src{font-size:12px;color:var(--sub);margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
  .act-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow-sm)}
  .act-item .ck{display:flex;gap:10px;align-items:flex-start;font-size:15px;font-weight:700;cursor:pointer}
  .act-item .ck input{width:20px;height:20px;margin-top:2px;accent-color:var(--green);flex:none}
  .act-item .meta2{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .act-item .vf{font-size:12.5px;color:var(--sub);margin-top:6px}
  .me-list{display:flex;flex-direction:column;gap:10px;margin-top:4px}
  .me-btn{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:16px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-sm);min-height:56px;
    text-align:left;width:100%;color:var(--ink);font-family:inherit}
  .me-btn .mi2{font-size:20px}

/* =====================================================
   P1 翻页式阅读（移动端，2026-10-01）
   一屏一页、零纵向滚动；仅 ≤768px 生效，桌面端零影响
   ===================================================== */
@media(max-width:768px){
  body{overflow:hidden}                             /* 页面级滚动由分页取代 */
  .overlay{z-index:70;overflow:hidden}              /* 盖过 tabbar(60)，modal 自管理 */
  .modal{display:flex;flex-direction:column;height:100dvh;min-height:0}
  #stage-head-out{flex:none;padding:0 14px}
  #stage-head-out .stage-head{margin:8px 0 10px}
  /* 分页宿主：flex 列，页面包裹层吃剩余高度，控制条钉底 */
  .paging{display:flex;flex-direction:column;overflow:hidden !important;padding:0 !important}
  .paging>.pgwrap{flex:1;min-height:0;overflow:hidden;position:relative}
  .paging>.pgwrap>.pg{display:none;height:100%;overflow:hidden;padding:4px 14px 10px}
  .paging>.pgwrap>.pg.on{display:block}
  .paging>.pgwrap>.pg.over{overflow-y:auto;-webkit-overflow-scrolling:touch}  /* 单块超一屏的兜底 */

<script>
/* ===== 访问口令门：静态站仅防随手翻，非真鉴权，口令明文在此 ===== */
(function(){
  var PASS='AIREAD2026', KEY='reading_gate_v1';
  var local=location.protocol==='file:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';
  window.__gateOn=!local;               /* 本地打开不设门，免得自己碍自己 */
  window.__gatePass=PASS;
  window.__gateReset=function(){try{localStorage.removeItem(KEY)}catch(e){}};
  window.__gateLock=function(){try{localStorage.removeItem(KEY)}catch(e){};location.reload();};
  var locked=true;
  try{if(localStorage.getItem(KEY)==='ok')locked=false}catch(e){}
  if(local)locked=false;
  if(locked)document.documentElement.setAttribute('data-locked','1');
  window.__gateUnlock=function(v){
    if(String(v||'').trim().toUpperCase()!==PASS)return false;
    try{localStorage.setItem(KEY,'ok')}catch(e){}
    document.documentElement.removeAttribute('data-locked');  /* CSS 自动把 #gate 藏起来 */
    return true;
  };
  window.__gateOpen=function(){           /*  forgot 兜底：地址栏带 #口令 直接开 */
    try{localStorage.setItem(KEY,'ok')}catch(e){}
    document.documentElement.removeAttribute('data-locked');
  };
  window.__doGate=function(){
    var i=document.getElementById('gate-input');if(!i)return;
    if(window.__gateUnlock(i.value)){
      var b=document.getElementById('lockbar');
      if(!b){b=document.createElement('div');b.id='lockbar';document.body.appendChild(b);}
      b.innerHTML='已解锁 · <a href="javascript:void(0)" onclick="__gateLock()">锁定</a>';
    }else{
      var e=document.getElementById('gate-err');if(!e)return;
      window.__gateFails=(window.__gateFails||0)+1;
      e.textContent=window.__gateFails>=3
        ? '口令不正确。若自己忘记，可在网址末尾加 #'+PASS+' 后回车即可打开。'
        : '口令不正确';
    }
  };
  document.addEventListener('DOMContentLoaded',function(){
    var i=document.getElementById('gate-input');if(!i)return;
    i.addEventListener('keydown',function(e){if(e.key==='Enter')__doGate()});
    var h=(location.hash||'').replace(/^#/,'').trim().toUpperCase();
    if(h===PASS)__gateOpen();
  });
})();
</script>

   数据唯一来源: data/state.js (window.READING_DATA)
   localStorage 仅作运行缓存 + 滚动备份
   设计语言参考「可视化拆书助手」：明亮 / 暖橙→墨蓝渐变 / Bento 卡片
   ========================================================= */

const STAGES = [
  {id:1,name:'新书推荐',icon:'📥',desc:'从豆瓣/微信读书推荐，入库并拆分章节'},
  {id:2,name:'粗读',icon:'🔍',desc:'作者信息、全书总概括、核心提炼、知识图谱'},
  {id:3,name:'逐章拆解',icon:'📑',desc:'目录与逐章拆解，补充个人理解'},
  {id:4,name:'逻辑链',icon:'🔗',desc:'生成全书逻辑链'},
  {id:5,name:'重点推荐',icon:'🎯',desc:'基于身份画像推荐重点章节，针对性阅读'},
  {id:6,name:'原子笔记',icon:'🗒️',desc:'Zettelkasten 原子笔记'},
  {id:7,name:'行动清单',icon:'✅',desc:'生成可执行行动清单'},
  {id:8,name:'书评发布',icon:'📣',desc:'撰写书评，确认后发布至公众号'},
];
const STATUS = ['todo','doing','done'];
const STATUS_TXT = {todo:'未开始',doing:'进行中',done:'已完成'};
const STORE_KEY = 'reading-system-v1';
const TOTAL_TARGET = 50;
const PALETTE = ['#F59E0B','#3B82F6','#10B981','#FE2C55','#8B5CF6','#06B6D4','#F97316','#EC4899','#14B8A6','#6366F1'];

let state = { profile:{name:'',roles:[],goals:[],interests:[],purpose:''}, books:[] };
let currentBookId = null;
let currentStage = 1;
let filterMode = 'all';
let searchText = '';

/* ---------- utils ---------- */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){return new Date().toISOString().slice(0,10)}
function $(s,r=document){return r.querySelector(s)}
function $$(s,r=document){return [...r.querySelectorAll(s)]}
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function mdPreview(text){ // 把 markdown 表格/列表渲染成只读预览（跟随 textarea，编辑即所见）
  const t=(text||'').trim();if(!t)return '';
  const lines=t.split('\n').map(l=>l.trim()).filter(Boolean);
  const isRow=l=>l.startsWith('|')&&l.endsWith('|');
  let html='';
  if(lines.filter(isRow).length>=2){ // markdown 表格
    const rows=lines.filter(isRow).map(l=>l.slice(1,-1).split('|').map(c=>c.trim()));
    const head=rows[0],body=rows.slice(1).filter(r=>!r.every(c=>/^:?-{2,}:?$/.test(c)));
    html+='<div class="md-preview"><table><thead><tr>'+head.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'
      +body.map(r=>'<tr>'+head.map((_,i)=>'<td>'+esc(r[i]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
  }else{ // 列表/段落
    html='<div class="md-preview">'+lines.map(l=>{
      const m=l.match(/^(.+?)【(我的评论)】(.*)$/);
      if(m)return '<div class="mi">'+esc(m[1])+' <span class="myc">💭 '+esc('【'+m[2]+'】'+m[3])+'</span></div>';
      return '<div class="mi">'+esc(l)+'</div>';
    }).join('')+'</div>';
  }
  return html;
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}
function getPath(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o)}
function setPath(o,p,v){const ks=p.split('.');let c=o;for(let i=0;i<ks.length-1;i++){if(c[ks[i]]==null)c[ks[i]]={};c=c[ks[i]]}c[ks[ks.length-1]]=v}

/* ---------- stage status helpers ---------- */
function bookStage(book,sid){return book.stages[sid]||(book.stages[sid]={status:'todo',data:{}})}
function doneCount(book){return STAGES.filter(s=>bookStage(book,s.id).status==='done').length}
function currentStageOf(book){
  for(const s of STAGES){const st=bookStage(book,s.id).status;if(st!=='done')return s.id}
  return 8;
}
function bookProgress(book){return Math.round(doneCount(book)/8*100)}

/* ---------- persistence ---------- */
function save(){
  const json=JSON.stringify(state);
  try{
    // 滚动备份最近3版：写入前把上一版推入 _bak 链，误操作可回滚
    const prev=localStorage.getItem(STORE_KEY);
    if(prev){
      for(let i=3;i>1;i--){
        const b=localStorage.getItem(STORE_KEY+'_bak'+(i-1));
        if(b)localStorage.setItem(STORE_KEY+'_bak'+i,b);
      }
      localStorage.setItem(STORE_KEY+'_bak1',prev);
    }
    localStorage.setItem(STORE_KEY,json);
  }catch(e){
    alert('保存失败（存储空间可能已满）！请立即用工具栏"导出"备份当前数据。\n'+e.message);
  }
}
function load(){
  try{const raw=localStorage.getItem(STORE_KEY);if(raw){state=JSON.parse(raw);return true}}catch(e){}
  return false;
}

/* ---------- 内置数据（P0 外置：真实数据在 data/state.js） ---------- */
function demoData(){
  if(!window.READING_DATA){alert('未找到 data/state.js —— 数据文件缺失或未通过 http 服务打开');return {version:DATA_VERSION,profile:{name:'读者'},books:[]};}
  return JSON.parse(JSON.stringify(window.READING_DATA));
}
function mkBook(title,author,color,emoji,source,tags,stageArr){
  const b={id:uid(),title,author,coverColor:color,coverEmoji:emoji,addedDate:today(),source,tags:tags||[],stages:{}};
  stageArr.forEach(([sid,st,data])=>{b.stages[sid]={status:st,data:data||{}}});
  return b;
}

/* =========================================================
   DASHBOARD RENDER
   ========================================================= */
function renderKPIs(){
  const total=state.books.length;
  const doneBooks=state.books.filter(b=>doneCount(b)===8).length;
  const doingBooks=state.books.filter(b=>{const d=doneCount(b);return d>0&&d<8}).length;
  const todoBooks=state.books.filter(b=>doneCount(b)===0).length;
  const totalDone=state.books.reduce((a,b)=>a+doneCount(b),0);
  $('#kpis').innerHTML=`
    <div class="kpi"><div class="num o">${total}<span style="font-size:15px;color:var(--sub)"> / ${TOTAL_TARGET}</span></div><div class="lbl">已入库书籍（全年目标 ${TOTAL_TARGET}）</div></div>
    <div class="kpi"><div class="num g">${doneBooks}</div><div class="lbl">八环全完成</div></div>
    <div class="kpi"><div class="num b">${doingBooks}</div><div class="lbl">进行中</div></div>
    <div class="kpi"><div class="num">${todoBooks}</div><div class="lbl">未开始</div></div>
    <div class="kpi"><div class="num g">${totalDone}<span style="font-size:15px;color:var(--sub)"> / ${TOTAL_TARGET*8}</span></div><div class="lbl">累计完成环节数</div></div>`;
}
function renderDist(){
  // 当前所处阶段分布
  const counts={};STAGES.forEach(s=>counts[s.id]=0);
  state.books.forEach(b=>{counts[currentStageOf(b)]++});
  $('#dist').innerHTML=STAGES.map(s=>{
    const n=counts[s.id];const h=Math.max(6,n/ (Math.max(1,...Object.values(counts))) *100);
    return `<div class="col">
      <div class="stack"><div class="fill" style="height:${h}%"></div></div>
      <div class="cnt">${n}</div>
      <div class="stage"><b>${s.icon} ${s.name}</b><br>当前 ${n} 本</div>
    </div>`;
  }).join('');
}
function renderGrid(){
  const grid=$('#grid');
  let list=state.books.filter(b=>{
    if(filterMode==='done'&&doneCount(b)!==8)return false;
    if(filterMode==='doing'&&!(doneCount(b)>0&&doneCount(b)<8))return false;
    if(filterMode==='todo'&&doneCount(b)!==0)return false;
    if(searchText){const t=searchText.toLowerCase();const hay=(b.title+b.author+(b.tags||[]).join('')).toLowerCase();if(!hay.includes(t))return false;}
    return true;
  });
  let html='';
  list.forEach(b=>{
    const cs=currentStageOf(b);const csName=cs===8&&doneCount(b)===8?'全部完成':STAGES[cs-1].name;
    const pct=bookProgress(b);
    const seg=STAGES.map(s=>{const st=bookStage(b,s.id).status;return `<i class="${st}"></i>`}).join('');
    const curCls=doneCount(b)===8?'badge-done':(doneCount(b)>0?'badge-doing':'badge-todo');
    html+=`<div class="book" data-action="open-book" data-id="${b.id}">
      <div class="cover" style="background:linear-gradient(120deg,${b.coverColor},${shade(b.coverColor,-18)})">
        <span class="emoji">${b.coverEmoji||'📖'}</span><span class="t">${esc(b.title)}</span>
      </div>
      <div class="body">
        <div class="author">${esc(b.author||'未知作者')}</div>
        <div class="seg">${seg}</div>
        <div class="meta">
          <span class="pct" style="color:${pct===100?'var(--green)':'var(--blue)'}">${pct}%</span>
          <span class="cur ${curCls}">${doneCount(b)===8?'✅ 全完成':('阶段'+cs+'·'+csName)}</span>
        </div>
      </div></div>`;
  });
  // ghost slots up to target
  const ghosts=Math.max(0,TOTAL_TARGET-state.books.length);
  for(let i=0;i<ghosts;i++){
    html+=`<div class="book ghost" data-action="add-book"><div class="plus">＋</div><div>待入库（${state.books.length+i+1}/${TOTAL_TARGET}）</div></div>`;
  }
  if(list.length===0&&ghosts===0)html='<div class="empty">还没有符合筛选条件的书，点击右上角「新增书籍」开始。</div>';
  grid.innerHTML=html;
  Pager.refresh($('#homeview'));   // 筛选/搜索改变内容高度 → 重排分页（保持页码）
}
function shade(hex,p){ // lighten/darken hex
  if(!hex||typeof hex!=='string'||!/^#[0-9a-fA-F]{6}$/.test(hex))hex='#64748B'; // fallback slate
  const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.max(0,Math.min(255,r+p));g=Math.max(0,Math.min(255,g+p));b=Math.max(0,Math.min(255,b+p));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
/* =========================================================
   v1.6 留存版：复习循环 + 漏斗埋点
   ========================================================= */
const REVIEW_INTERVALS=[1,2,4,7,15,30]; // Leitner 间隔（天）
function addDaysISO(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function allCardsCount(){let n=0;state.books.forEach(b=>n+=(getPath(b,'stages.6.data.cards')||[]).length);return n;}
function dueCards(withinDays){
  const cut=addDaysISO(today(),withinDays||0);
  const out=[];
  state.books.forEach(b=>{
    (getPath(b,'stages.6.data.cards')||[]).forEach(c=>{
      const rv=c.review||{};
      if(rv.next&&rv.next<=cut)out.push({book:b,card:c});
    });
  });
  return out;
}
function advanceReview(rv){
  const t=today();
  rv.last=t;
  rv.box=Math.min((rv.box||0)+1,REVIEW_INTERVALS.length-1);
  rv.next=addDaysISO(t,REVIEW_INTERVALS[rv.box]);
  rv.history=rv.history||[];
  rv.history.push({date:t,box:rv.box});
}
/* ---- v1.7 行动执行：收件箱 + 排期 due + 执行时间戳 doneAt ---- */
let actShowAll=false;
function isDone(a){return !!(a&&a.doneAt);}
function setActionDone(a,v){a.done=!!v;a.doneAt=v?today():null;}
function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);}
function actStats(){let tot=0,dn=0;state.books.forEach(b=>(getPath(b,'stages.7.data.actions')||[]).forEach(a=>{tot++;if(isDone(a))dn++;}));return{tot,dn};}
function weeklyDone(){const cut=addDaysISO(today(),-7);let n=0;state.books.forEach(b=>(getPath(b,'stages.7.data.actions')||[]).forEach(a=>{if(a.doneAt&&a.doneAt>=cut)n++;}));return n;}
function dueActions(){
  const out=[];
  state.books.forEach(b=>(getPath(b,'stages.7.data.actions')||[]).forEach((a,i)=>{if(isDone(a))return;out.push({book:b,action:a,idx:i});}));
  out.sort((x,y)=>{const dx=x.action.due||'9999-12-31',dy=y.action.due||'9999-12-31';return dx<dy?-1:dx>dy?1:0;});
  return out;
}
function renderActions(){
  const el=$('#actinbox');if(!el)return;
  const all=dueActions();const t=today();
  const overdue=all.filter(x=>x.action.due&&x.action.due<t).length;
  const due7=all.filter(x=>x.action.due&&x.action.due<=addDaysISO(t,7)).length;
  const top=actShowAll?all:all.slice(0,3);
  let rows;
  if(top.length){
    rows=top.map(x=>{
      const b=x.book,a=x.action;
      const od=a.due&&a.due<t;
      const dueTxt=a.due?(od?('逾期 '+daysBetween(a.due,t)+'天'):('剩 '+daysBetween(t,a.due)+'天')):'未排期';
      const dueCls=od?'rq-due on':(a.due?'rq-due':'');
      return `<div class="rq-item">
        <div class="rq-main">
          <div class="rq-tt">${esc(a.content||'(空行动)')}</div>
          <div class="rq-ol">${b.coverEmoji||'📖'} 《${esc(b.title)}》${a.layer?' · '+esc(a.layer):''}</div>
          <div class="rq-tags"><span class="${dueCls}">${dueTxt}</span>${a.priority?`<span class="rq-pri">${esc(a.priority)}</span>`:''}${a.effort?`<span class="rq-eff">${esc(a.effort)}</span>`:''}</div>
        </div>
        <button class="rq-btn" data-action="action-done" data-book="${b.id}" data-i="${x.idx}">✓ 执行</button>
      </div>`;
    }).join('');
  } else rows='<div class="empty" style="padding:10px">🎉 行动都清空了，去「环节7」加新启发吧。</div>';
  const st=actStats();const pct=st.tot?Math.round(st.dn/st.tot*100):0;
  const footLink=actShowAll?'<a data-action="act-all" style="color:var(--blue);cursor:pointer">收起</a>':'<a data-action="act-all" style="color:var(--blue);cursor:pointer">查看全部 '+all.length+' 条</a>';
  el.innerHTML=`
    <div class="ret-card">
      <div class="ret-h">📥 今日行动精选 <span class="ret-badge ${overdue?'on':''}">待执行 ${all.length} · 逾期 ${overdue}</span></div>
      <div class="rq-list">${rows}</div>
      <div class="ret-foot">本周到期 ${due7} 条 · ${footLink}</div>
    </div>
    <div class="ret-card">
      <div class="ret-h">📈 行动执行动能</div>
      <div class="fn-row"><span class="fn-name">累计执行率</span><span class="fn-bar"><i style="width:${pct}%"></i></span><span class="fn-cnt">${st.dn}/${st.tot}</span></div>
      <div class="ret-foot">本周新执行 ${weeklyDone()} 条 · 待执行 ${all.length} 条</div>
    </div>`;
}
function renderRetain(){
  const el=$('#retain');if(!el)return;
  const total=state.books.length;
  // 1) 环节完成漏斗（红区 = 原子笔记 / 行动清单 / 书评，即 stage 6/7/8）
  const funnel=STAGES.map(s=>{
    let done=0;state.books.forEach(b=>{const st=b.stages[s.id];if(st&&st.status==='done')done++;});
    const pct=total?Math.round(done/total*100):0;
    const red=(+s.id>=6)?' red':'';
    return `<div class="fn-row${red}"><span class="fn-name${red}">${s.icon} ${s.name}</span><span class="fn-bar"><i style="width:${pct}%"></i></span><span class="fn-cnt">${done}/${total}</span></div>`;
  }).join('');
  const fullDone=state.books.filter(b=>doneCount(b)===8).length;
  // 2) 复习队列（本周待回顾）
  const due=dueCards(7);
  let queue;
  if(due.length){
    queue=due.slice(0,40).map(d=>{
      const b=d.book,c=d.card;
      return `<div class="rq-item">
        <div class="rq-main">
          <div class="rq-tt">${esc(c.concept||'(未命名卡)')}</div>
          ${c.oneLiner?`<div class="rq-ol">${esc(c.oneLiner)}</div>`:''}
          <div class="rq-src">${b.coverEmoji||'📖'} 《${esc(b.title)}》${c.source?' · '+esc(c.source):''}</div>
        </div>
        <button class="rq-btn" data-action="review-done" data-book="${b.id}" data-cardid="${esc(c.id)}">✓ 已复习</button>
      </div>`;
    }).join('');
  } else queue='<div class="empty" style="padding:10px">🎉 本周没有待回顾的卡，保持节奏！</div>';
  // 3) 行动执行率
  let actTotal=0,actDone=0;
  state.books.forEach(b=>(getPath(b,'stages.7.data.actions')||[]).forEach(a=>{actTotal++;if(isDone(a))actDone++;}));
  const actPct=actTotal?Math.round(actDone/actTotal*100):0;
  el.innerHTML=`
    <div class="ret-card">
      <div class="ret-h">📉 环节完成漏斗 <span class="ret-sub">（红区 = ${STAGES[5].name} / ${STAGES[6].name} / ${STAGES[7].name}）</span></div>
      ${funnel}
      <div class="ret-foot">八环节全完成：${fullDone} / ${total} 本</div>
    </div>
    <div class="ret-card">
      <div class="ret-h">🔁 复习队列 <span class="ret-badge ${due.length?'on':''}">本周待回顾 ${due.length} 张</span> <span class="ret-sub">/ 共 ${allCardsCount()} 张</span></div>
      ${due.length?`<button class="ret-all" data-action="review-all-week">一键标记本周已复习</button>`:''}
      <div class="rq-list">${queue}</div>
    </div>
    <div class="ret-card">
      <div class="ret-h">✅ 行动执行率</div>
      <div class="fn-row"><span class="fn-name">已执行行动</span><span class="fn-bar"><i style="width:${actPct}%"></i></span><span class="fn-cnt">${actDone}/${actTotal}</span></div>
      <div class="ret-foot">行动在「环节7」创建 → 首页收件箱一键执行；排期 due 驱动提醒</div>
    </div>`;
}
function migrateRetain(){
  let gi=0;
  state.books.forEach(b=>{
    STAGES.forEach(s=>{
      const st=b.stages[s.id];
      if(st&&typeof st==='object'&&!('doneAt' in st))st.doneAt=null;
    });
    (getPath(b,'stages.6.data.cards')||[]).forEach(c=>{
      if(!c.review)c.review={next:addDaysISO(today(),(gi%30)+1),last:null,box:0,history:[]};
      gi++;
    });
    (getPath(b,'stages.7.data.actions')||[]).forEach(a=>{
      if(!('done' in a))a.done=false;
      if(!('due' in a))a.due=a.done?null:addDaysISO(today(),14);
      if(!('doneAt' in a))a.doneAt=a.done?today():null;
      if(!('effort' in a))a.effort=null;
    });
  });
  save();
}

function renderAll(){
  renderKPIs();renderDist();renderGrid();renderRetain();renderActions();
  if(currentTab==='home')Pager.mount($('#homeview'),'tab');
}

/* =========================================================
   BOOK DETAIL MODAL
   ========================================================= */
function openBook(id){
  const b=state.books.find(x=>x.id===id);if(!b)return;
  currentBookId=id;currentStage=currentStageOf(b);
  $('#overlay').classList.add('show');   // 先显示再渲染，分页器才能量到真实高度
  renderModal();
}
function renderModal(){
  const b=state.books.find(x=>x.id===currentBookId);if(!b)return;
  const stepper=STAGES.map(s=>{const st=bookStage(b,s.id).status;const cls=st==='done'?'done':(st==='doing'?'doing':'');
    return `<div class="step ${cls} ${s.id===currentStage?'active':''}" data-action="goto-stage" data-sid="${s.id}"><span class="dot">${st==='done'?'✓':s.id}</span><span class="sname">${s.icon} ${s.name}</span></div>`;
  }).join('');
  $('#modal').innerHTML=`
    <div class="modal-head">
      <div><h2>${esc(b.title)}</h2><div class="sub">${esc(b.author||'')} · 来源：${esc(b.source||'—')} · 入库：${b.addedDate} · 进度 ${bookProgress(b)}%</div></div>
      <button class="x" data-action="close">✕</button>
    </div>
    <div class="stepper">${stepper}</div>
    <div id="read-prog"><i></i></div>
    <div id="stage-head-out"></div>
    <div class="stage-body" id="stage-body"></div>
    <div id="stage-foot">
      <button data-action="foot-prev">‹ 上一环节</button>
      <button data-action="tts-open" title="朗读本环节">🔊</button>
      <button data-action="foot-done" class="primary">✓ 标完成</button>
      <button data-action="foot-next">下一环节 ›</button>
    </div>`;
  renderStage();
}
function renderStage(){
  const b=state.books.find(x=>x.id===currentBookId);
  const s=STAGES.find(x=>x.id===currentStage);
  const st=bookStage(b,s.id);
  const head=`<div class="stage-head">
    <div class="l"><span class="ic">${s.icon}</span><div><div class="nm">${s.name}</div><div class="ds">${s.desc}</div></div></div>
    <div class="status-sel">
      <button class="add-btn" data-action="rd-open" style="flex:none">📖 阅读</button>
      ${STATUS.map(v=>`<span class="st ${v} ${st.status===v?'on':''}" data-action="set-status" data-v="${v}">${STATUS_TXT[v]}</span>`).join('')}
    </div></div>`;
  $('#stage-head-out').innerHTML=head;          // 环节头固定在分页区外，不跟着翻
  $('#stage-body').innerHTML=renderStageBody(b,s.id);
  Pager.mount($('#stage-body'),'modal');
  updateStageFoot();
  updateReadProg();
}
/* 吸底操作栏：上/下一环节可用性 + 标完成按钮文案 */
function updateStageFoot(){
  const f=$('#stage-foot');if(!f)return;
  const prev=f.querySelector('[data-action="foot-prev"]');
  const next=f.querySelector('[data-action="foot-next"]');
  const done=f.querySelector('[data-action="foot-done"]');
  if(prev)prev.disabled=currentStage<=1;
  if(next)next.disabled=currentStage>=8;
  const st=bookStage(getBook(),currentStage).status;
  if(done){done.textContent=st==='done'?'✓ 已完成':'✓ 标完成';done.disabled=st==='done';}
}
/* 阅读进度条：移动端跟翻页走，桌面端跟 stage-body 滚动走 */
function updateReadProg(){
  const bar=$('#read-prog>i');if(!bar)return;
  const body=$('#stage-body');if(!body)return;
  if(isMobile()){
    const rec=Pager.hosts.find(h=>h.el===body);
    if(rec&&rec.total>1)bar.style.width=((rec.cur+1)/rec.total*100)+'%';
    else bar.style.width='100%';
  }else{
    const h=body.scrollHeight-body.clientHeight;
    bar.style.width=h>4?Math.min(100,body.scrollTop/h*100)+'%':'100%';
  }
}
function renderStageBody(b,sid){
  const d=bookStage(b,sid).data;
  switch(sid){
    case 1: return stage1(b,d);
    case 2: return stage2(b,d);
    case 3: return stage3(b,d);
    case 4: return stage4(b,d);
    case 5: return stage5(b,d);
    case 6: return stage6(b,d);
    case 7: return stage7(b,d);
    case 8: return stage8(b,d);
  }
  return '';
}

/* ----- generic array editor ----- */
function arrEditor(arr,fields,arrKey,addLabel,sid){
  // arrKey e.g. 'stages.1.data.chapters'
  let h=`<div class="list-head"><span class="tt">📋 共 ${arr.length} 项</span><button class="add-btn" data-action="arr-add" data-key="${arrKey}" data-sid="${sid}">＋ ${addLabel}</button></div>`;
  if(arr.length===0)h+='<div class="empty">暂无条目，点击上方按钮添加。</div>';
  arr.forEach((it,i)=>{
    h+=`<div class="item"><div class="top"><span class="idx">#${i+1}</span><button class="del" data-action="arr-del" data-key="${arrKey}" data-i="${i}" data-sid="${sid}">删除</button></div>`;
    fields.forEach(f=>{
      const path=`${arrKey}.${i}.${f.name}`;
      if(f.type==='textarea')h+=`<div class="field"><span class="mini">${f.label}</span><textarea class="f" data-field="${path}" placeholder="${f.ph||''}">${esc(it[f.name])}</textarea></div>`;
      else if(f.type==='select')h+=`<div class="field"><span class="mini">${f.label}</span><select class="f" data-field="${path}">${f.options.map(o=>`<option ${it[f.name]===o?'selected':''}>${o}</option>`).join('')}</select></div>`;
      else h+=`<div class="field"><span class="mini">${f.label}</span><input class="f" data-field="${path}" value="${esc(it[f.name])}" placeholder="${f.ph||''}"></div>`;
    });
    h+=`</div>`;
  });
  return h;
}

function graphSVG(graph){
  const nodes=graph.nodes||[];const edges=graph.edges||[];
  if(nodes.length===0)return '<div class="empty">暂无症状图谱节点，添加节点与关联后自动绘制。</div>';
  const W=680,H=320,cx=W/2,cy=H/2,R=Math.min(W,H)/2-50;
  const pos=nodes.map((n,i)=>{const a=-Math.PI/2+i*2*Math.PI/nodes.length;return {x:cx+R*Math.cos(a),y:cy+R*Math.sin(a),n}});
  const colorOf=t=>({book:'#3B82F6',concept:'#F59E0B',project:'#10B981',person:'#8B5CF6'}[t]||'#6B7280');
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><defs></defs>`;
  edges.forEach(e=>{const a=pos[e.from],b=pos[e.to];if(!a||!b)return;svg+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#CBD5E1" stroke-width="2"/><text x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2-4}" font-size="10" fill="#94A3B8" text-anchor="middle">${esc(e.relation||'')}</text>`});
  pos.forEach(p=>{const c=colorOf(p.n.type);svg+=`<circle cx="${p.x}" cy="${p.y}" r="22" fill="${c}" opacity="0.92"/><text x="${p.x}" y="${p.y+4}" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">${esc((p.n.label||'').slice(0,4))}</text><text x="${p.x}" y="${p.y+38}" font-size="11" fill="#374151" text-anchor="middle">${esc(p.n.label||'')}</text>`});
  svg+=`</svg>`;return svg;
}

/* =========================================================
   P1 翻页式阅读（移动端）
   把宿主容器的直接子元素按可用高度贪心切页：
   一屏一页、底部控制条、左右滑动/边缘点按翻页。
   单块物理超一屏 → 独占一页并允许页内微滚动（兜底）。
   每次 render* 重设 innerHTML 后调用 Pager.mount 即可。
   ========================================================= */
const Pager={
  hosts:[],                               // 已分页的宿主，供 resize 重排
  _oh(el){const cs=getComputedStyle(el);  // 元素占位高 = 盒高 + 上下外边距
    return el.offsetHeight+parseFloat(cs.marginTop||0)+parseFloat(cs.marginBottom||0);},
  _flatten(host){                          // 解包：把 .pg 里的子元素倒回宿主
    const wrap=host.querySelector(':scope>.pgwrap');
    if(wrap){[...wrap.querySelectorAll(':scope>.pg')].forEach(pg=>{
      while(pg.firstChild)host.insertBefore(pg.firstChild,wrap);});wrap.remove();}
    const bar=host.querySelector(':scope>.pgr-bar');if(bar)bar.remove();
    host.classList.remove('paging','kbd');host.style.height='';
  },
  mount(host,mode){                        // mode: 'modal' | 'tab'
    if(!host)return;
    this._flatten(host);
    this.hosts=this.hosts.filter(h=>h.el!==host);
    if(!isMobile())return;                 // 桌面端保持原滚动布局
    if(host.offsetParent===null&&mode!=='modal')return; // 隐藏的宿主不测
    host.classList.add('paging');
    if(mode==='tab'){                      // 高度 = 视口 - 宿主顶 - tabbar
      const tb=$('#tabbar');const tbH=tb?tb.offsetHeight:0;
      host.style.height=Math.max(200,window.innerHeight-host.getBoundingClientRect().top-tbH)+'px';
    }
    const H=host.clientHeight;
    const kids=[...host.children].filter(el=>!el.classList.contains('pgr-bar'));
    if(!kids.length){return;}
    // 贪心切页
    const pages=[];let cur=[],used=0;
    kids.forEach(el=>{
      const h=this._oh(el);
      if(used>0&&used+h>H+2){pages.push(cur);cur=[];used=0;}
      cur.push(el);used+=h;
    });
    if(cur.length)pages.push(cur);
    // 包裹
    const wrap=document.createElement('div');wrap.className='pgwrap';
    pages.forEach(els=>{
      const pg=document.createElement('div');pg.className='pg';
      if(els.length===1&&this._oh(els[0])>H+2)pg.classList.add('over');
      els.forEach(e=>pg.appendChild(e));wrap.appendChild(pg);
    });
    host.appendChild(wrap);
    const rec={el:host,mode,cur:Math.min(host._pgCur||0,pages.length-1),total:pages.length};
    // 控制条（仅多页时显示）
    if(pages.length>1){
      const bar=document.createElement('div');bar.className='pgr-bar';
      bar.innerHTML=`<button class="pgr-btn" data-dir="-1">‹ 上一页</button><span class="pgr-ind"></span><button class="pgr-btn" data-dir="1">下一页 ›</button>`;
      bar.addEventListener('click',e=>{const b=e.target.closest('.pgr-btn');if(b)this.go(rec,+b.dataset.dir);});
      host.appendChild(bar);
    }
    this._bind(rec);this._show(rec);this.hosts.push(rec);
  },
  refresh(host){const rec=this.hosts.find(h=>h.el===host);
    if(rec){host._pgCur=rec.cur;this.mount(host,rec.mode);}},
  remountAll(){this.hosts.slice().forEach(rec=>{rec.el._pgCur=rec.cur;this.mount(rec.el,rec.mode);});},
  go(rec,dir){this._show(rec,rec.cur+dir);},
  _show(rec,to){
    rec.cur=Math.max(0,Math.min(rec.total-1,to===undefined?rec.cur:to));
    const pgs=rec.el.querySelectorAll(':scope>.pgwrap>.pg');
    pgs.forEach((pg,i)=>pg.classList.toggle('on',i===rec.cur));
    const ind=rec.el.querySelector(':scope>.pgr-bar .pgr-ind');
    if(ind)ind.textContent=(rec.cur+1)+' / '+rec.total;
    const btns=rec.el.querySelectorAll(':scope>.pgr-bar .pgr-btn');
    if(btns[0])btns[0].disabled=rec.cur===0;
    if(btns[1])btns[1].disabled=rec.cur===rec.total-1;
    rec.el._pgCur=rec.cur;
    if(typeof updateReadProg==='function')updateReadProg();
  },
  _bind(rec){
    const host=rec.el;if(host._pgBound)return;host._pgBound=true;
    // 左右滑动翻页
    let sx=0,sy=0;
    host.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
    host.addEventListener('touchend',e=>{
      const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;
      if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)this.go(rec,dx<0?1:-1);
    },{passive:true});
    // 边缘点按翻页（不抢输入控件/按钮的点击）
    host.addEventListener('click',e=>{
      if(e.target.closest('input,textarea,select,button,label,a,[data-action],.check'))return;
      if(window.getSelection&&String(window.getSelection()))return;
      const r=host.getBoundingClientRect();const x=e.clientX-r.left;
      if(x<r.width*0.16)this.go(rec,-1);
      else if(x>r.width*0.84)this.go(rec,1);
    });
    // 键盘弹出兜底：聚焦输入控件时允许页内滚动
    host.addEventListener('focusin',e=>{
      if(e.target.closest('input,textarea,select'))host.classList.add('kbd');});
    host.addEventListener('focusout',()=>{host.classList.remove('kbd');host.scrollTop=0;});
  }
};

/* =========================================================
   P0 底部 Tab + 聚合视图（移动端）
   ========================================================= */
let currentTab='home';
let noteFilter='all';
function isMobile(){return window.matchMedia('(max-width:768px)').matches}
function switchTab(t){
  currentTab=t;
  $$('#tabbar .tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===t));
  const home=t==='home';
  const hv=$('#homeview');if(hv)hv.style.display=home?'':'none';
  $('#aggview').style.display=home?'none':'';
  if(home)Pager.mount($('#homeview'),'tab');else renderAgg(t);
  history.replaceState(null,'','#tab='+t);
  window.scrollTo(0,0);
}
function renderAgg(t){
  const v=$('#aggview');
  if(t==='stages')v.innerHTML=aggStages();
  else if(t==='notes')v.innerHTML=aggNotes();
  else if(t==='actions')v.innerHTML=aggActions();
  else if(t==='me')v.innerHTML=aggMe();
  Pager.mount(v,'tab');
}
/* 环节 Tab：书 × 8 环节矩阵，点击直达该书该环节 */
function aggStages(){
  if(!state.books.length)return '<div class="empty">还没有入库书籍。</div>';
  return state.books.map(b=>{
    const pct=bookProgress(b);
    const steps=STAGES.map(s=>{
      const st=bookStage(b,s.id).status;
      return `<div class="agg-step ${st}" data-action="agg-open" data-book="${b.id}" data-sid="${s.id}">${s.icon}<br>${s.name}</div>`;
    }).join('');
    return `<div class="agg-book">
      <div class="bt"><span>${b.coverEmoji||'📖'} ${esc(b.title)}</span><span class="pc">${pct}%</span></div>
      <div class="agg-steps">${steps}</div></div>`;
  }).join('');
}
/* 笔记 Tab：聚合所有书的原子卡（只读），按类型筛选 */
function aggNotes(){
  const TYPES=['概念卡','行动卡','观点卡'];
  const chips=['all',...TYPES].map(v=>`<span class="chip ${noteFilter===v?'on':''}" data-action="note-filter" data-v="${v}">${v==='all'?'全部':v}</span>`).join('');
  let out='';
  let total=0;
  state.books.forEach(b=>{
    const cards=(getPath(b,'stages.6.data.cards')||[]);
    cards.forEach(c=>{
      const ty=c.type||'概念卡';
      if(noteFilter!=='all'&&ty!==noteFilter)return;
      total++;
      out+=`<div class="note-card">
        <div class="nh"><span class="nt">${esc(c.concept||'(未命名)')}</span><span class="tp">${ty}</span></div>
        ${c.oneLiner?`<div class="ol">💡 ${esc(c.oneLiner)}</div>`:''}
        ${c.points?`<div class="pt">${esc(c.points)}</div>`:''}
        <div class="src">${b.coverEmoji||'📖'} 《${esc(b.title)}》${c.source?' · '+esc(c.source):''}</div>
      </div>`;
    });
  });
  return `<div class="agg-filter">${chips}</div>`
    +(total?out:'<div class="empty">还没有'+(noteFilter==='all'?'':noteFilter)+'卡片。原子卡在「环节6」里创建。</div>');
}
/* 行动 Tab：聚合所有书的行动清单，可勾选（写回 state） */
function aggActions(){
  const LAYERS=['认知层','决策层','行动层','信息素养层'];
  let any=false,out='';
  LAYERS.forEach(layer=>{
    let items='';
    state.books.forEach(b=>{
      const acts=(getPath(b,'stages.7.data.actions')||[]);
      acts.forEach((a,i)=>{
        if((a.layer||'行动层')!==layer)return;
        any=true;
        items+=`<div class="act-item">
          <label class="ck"><input type="checkbox" data-action="agg-toggle" data-book="${b.id}" data-i="${i}" ${a.done?'checked':''}>
            <span style="${a.done?'text-decoration:line-through;color:var(--sub)':''}">${esc(a.content)}</span></label>
          <div class="meta2">
            <span class="pill">${a.priority||'P1'}</span>
            <span class="pill hit">${b.coverEmoji||'📖'} ${esc(b.title)}</span>
          </div>
          ${a.verify?`<div class="vf">✔️ 做到算数：${esc(a.verify)}</div>`:''}
        </div>`;
      });
    });
    if(items)out+=`<div class="sec-title" style="padding:0 2px"><span class="bar"></span>${layer}</div>`+items;
  });
  return out||'<div class="empty">还没有行动项。行动清单在「环节7」里创建。</div>';
}
/* 我的 Tab：身份画像 + 数据管理（header 按钮的移动端落点） */
function aggMe(){
  const total=state.books.length;
  const totalDone=state.books.reduce((a,b)=>a+doneCount(b),0);
  const totalCards=state.books.reduce((a,b)=>a+((getPath(b,'stages.6.data.cards')||[]).length),0);
  const totalActs=state.books.reduce((a,b)=>a+((getPath(b,'stages.7.data.actions')||[]).length),0);
  const p=state.profile||{};
  return `
  <div class="profile-box">
    <div class="kv"><b>🎯 身份画像：</b>${esc(p.name||'未填写')}</div>
    <div class="kv" style="color:var(--sub);font-size:12.5px">角色 ${(p.roles||[]).length} · 目标 ${(p.goals||[]).length} · 兴趣 ${(p.interests||[]).length}${p.name?'':'（建议先填写，环节5/6/8 的个性化靠它）'}</div>
  </div>
  <div class="profile-box">
    <div class="kv"><b>📊 数据总览</b></div>
    <div class="kv">入库 ${total} 本 · 完成环节 ${totalDone} · 原子卡 ${totalCards} 张 · 行动 ${totalActs} 项</div>
  </div>
  <div class="me-list">
    <button class="me-btn" data-action="profile"><span class="mi2">🎯</span>编辑身份画像</button>
    <button class="me-btn" data-action="add-book"><span class="mi2">＋</span>新增书籍</button>

    <button class="me-btn" data-action="import"><span class="mi2">⬆</span>导入数据</button>

  <div class="empty" style="font-size:12px">数据保存在本机浏览器，记得定期导出备份</div>`;

/* =========================================================
   P2 内容提取层：把某书某环节的数据转成「可阅读的章节」
   供阅读视图渲染 + TTS 朗读共用（单一真相，不解析 DOM）
   返回: [{t:'小节标题', paras:['段落',...]}, ...]
   ========================================================= */
function extractReadable(b,sid){
  const d=bookStage(b,sid).data;const S=[];
  const sec=(t,...paras)=>{const p=paras.map(x=>(x==null?'':String(x)).trim()).filter(Boolean);if(p.length)S.push({t,paras:p});};
  const lines=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
  switch(sid){
    case 1:
      sec('书籍信息',`《${b.title}》 ${b.author||''}`,b.source&&`来源：${b.source}`,(b.tags||[]).length&&'标签：'+b.tags.join('、'));
      (d.chapters||[]).forEach((c,i)=>sec(`章节 ${i+1}：${c.title||'未命名'}`,c.summary,c.note));
      if(d.reason)sec('入库理由',d.reason);
      break;
    case 2:
      sec('一句话总结',d.oneLiner);
      sec('这本书在回答什么问题',d.coreQuestion);
      sec('作者的答案',d.authorAnswer);
      sec('作者信息',d.authorInfo);
      sec('写作背景',d.authorBackground);
      if(d.authorWorks)sec('作者其他作品',...lines(d.authorWorks));
      if(d.authorRelations)sec('名人关联',...lines(d.authorRelations));
      (d.concepts||[]).forEach(c=>sec(`核心概念：${c.name||'未命名'}`,c.definition,c.plain&&`人话翻译：${c.plain}`,c.whenUse&&`什么时候用：${c.whenUse}`));
      if(d.insights)sec('深度洞察',...lines(d.insights));
      if(d.expertReviews)sec('专家与媒体评价',...lines(d.expertReviews));
      if(d.hotReviews)sec('网络热评',...lines(d.hotReviews));
      break;
    case 3:
      (d.chapters||[]).forEach(c=>{
        sec(`章节：${c.title||'未命名'}`,c.summary,c.personal&&`个人理解：${c.personal}`);
        const qs=lines(c.quotes);if(qs.length)S.push({t:`${c.title||''} · 金句`,paras:qs,quote:true});
        const cs=lines(c.cases);if(cs.length)S.push({t:`${c.title||''} · 案例`,paras:cs});
        const dc=lines(c.deepCard);if(dc.length)S.push({t:`${c.title||''} · 六维深化卡`,paras:dc});
      });
      break;
    case 4:
      (d.chain||[]).forEach((c,i)=>sec(`逻辑环节 ${i+1}：${c.label||'未命名'}`,c.note));
      break;
    case 5:
      (d.recommended||[]).filter(r=>r.isKey).forEach(r=>sec(`重点章节：${r.title}`,r.rationale));
      sec('针对性阅读总结',d.note);
      break;
    case 6:
      (d.cards||[]).forEach(c=>{
        sec(`${c.type||'概念卡'}：${c.concept||'未命名'}`,c.oneLiner,...lines(c.points),c.myThought&&`我的思考：${c.myThought}`);
      });
      break;
    case 7:
      sec('行动清单',...(d.actions||[]).map((a,i)=>`${i+1}. ${a.content||''}${a.verify?`（做到算数：${a.verify}）`:''}${a.done?' ✅':''}`));
      break;
    case 8:
      sec('书评草稿',...lines(d.draft));
      sec('发布状态',`当前状态：${d.publishStatus||'草稿'}${d.hitScore?`，爆款评分 ${d.hitScore}`:''}`);
      break;
  }
  return S;
}
/* 把所有环节合并成「全书阅读」 */
function extractBook(b){
  const S=[];
  STAGES.forEach(s=>{
    const secs=extractReadable(b,s.id);
    if(secs.length)S.push({t:`${s.icon} 环节${s.id} · ${s.name}`,paras:[],header:true},...secs);
  });
  return S;
}

/* =========================================================
   P2 TTS 朗读引擎（Web Speech API，零依赖）
   设计要点：
   - 长文本自动分段：每段一条 utterance，队列顺播。iOS/桌面 Chrome
     对超长单条 utterance 会静默中断，分段队列是标准解法。
   - 移动端自动播放限制：speechSynthesis 必须由用户手势触发，
     因此播放只由点击启动；首段在用户点击的调用栈内 speak()。
   - Chrome 桌面端长 utterance 约 15s 自动暂停 → keepAlive 定时 resume()。
   - 高亮同步：onstart 给对应段落元素加 .tts-cur 并滚动到可视区。
   ========================================================= */
const TTS={
  segs:[],idx:-1,playing:false,rate:1.0,supported:('speechSynthesis' in window),
  _keepAlive:null,_hl:null,_onState:null,
  RATES:[0.8,1.0,1.2,1.5,2.0],
  init(){
    if(!this.supported)return;
    // 部分浏览器 voices 异步加载，先触发一次
    try{speechSynthesis.getVoices();}catch(e){}
  },
  /* segs: [{text, el|null}]；el 用于高亮。onState(playing) 同步按钮文案 */
  load(segs,onState){
    this.stop(false);
    this.segs=segs.filter(s=>s.text&&s.text.trim());
    this.idx=-1;this._onState=onState||null;
    this._bar(true);
    this._info(this.segs.length?`共 ${this.segs.length} 段，点 ▶ 开始`:'无可读内容');
  },
  play(){
    if(!this.supported){this._info('当前浏览器不支持朗读');toast('当前浏览器不支持语音朗读');return;}
    if(!this.segs.length)return;
    if(this.playing){this.pause();return;}
    if(speechSynthesis.paused&&this.idx>=0){      // 继续（iOS 需直接 resume）
      speechSynthesis.resume();this.playing=true;this._syncBtn();this._keepAliveStart();return;
    }
    this._speak(this.idx<0?0:this.idx);
  },
  pause(){
    if(!this.playing)return;
    speechSynthesis.pause();this.playing=false;this._syncBtn();this._keepAliveStop();
    this._info(`已暂停 ${this.idx+1}/${this.segs.length}`);
  },
  stop(clearBar=true){
    if(this.supported){try{speechSynthesis.cancel();}catch(e){}}
    this.playing=false;this._keepAliveStop();this._clearHL();
    this._syncBtn();
    if(clearBar)this._bar(false);
  },
  next(){if(this.idx<this.segs.length-1)this._jump(this.idx+1);},
  prev(){if(this.idx>0)this._jump(this.idx-1);},
  jumpTo(i){if(i>=0&&i<this.segs.length)this._jump(i);},
  cycleRate(){
    const i=(this.RATES.indexOf(this.rate)+1)%this.RATES.length;
    this.rate=this.RATES[i];
    const b=document.getElementById('tts-rate-btn');if(b)b.textContent=this.rate.toFixed(1)+'×';
    if(this.playing)this._speak(this.idx);          // 重说当前段以应用新语速
    else this._info(`语速 ${this.rate.toFixed(1)}×`);
  },
  _jump(i){const was=this.playing||speechSynthesis.speaking;this._speak(i);if(!was)this._info(`第 ${i+1}/${this.segs.length} 段（点 ▶ 播放）`);},
  _speak(i){
    if(!this.supported||!this.segs[i])return;
    speechSynthesis.cancel();                        // 先清空队列，防叠音
    this.idx=i;
    const u=new SpeechSynthesisUtterance(this.segs[i].text.trim());
    u.rate=this.rate;u.lang='zh-CN';
    const v=this._pickVoice();if(v)u.voice=v;
    u.onstart=()=>{this.playing=true;this._syncBtn();this._hl(this.segs[i]);this._info(`朗读中 ${i+1}/${this.segs.length}`);};
    u.onend=()=>{if(this.idx!==i)return;             // 被打断（跳段/停止）则不接力
      if(i+1<this.segs.length)this._speak(i+1);
      else{this.playing=false;this._syncBtn();this._keepAliveStop();this._clearHL();this._info('✅ 朗读完毕');}};
    u.onerror=(e)=>{if(e.error==='interrupted'||e.error==='canceled')return;
      if(i+1<this.segs.length)this._speak(i+1);      // 单段失败跳过错段，不中断整篇
      else{this.playing=false;this._syncBtn();this._info('朗读出错');}};
    speechSynthesis.speak(u);
    this._keepAliveStart();
  },
  _pickVoice(){
    try{const vs=speechSynthesis.getVoices();
      return vs.find(v=>/zh[-_]CN/i.test(v.lang)&&/xiaoxiao|ting|mei|hui|yaoyao|google/i.test(v.name))
          || vs.find(v=>/zh[-_]CN/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null;}catch(e){return null;}
  },
  /* Chrome 桌面端 >15s utterance 自动暂停的已知 bug：周期性 resume 保活 */
  _keepAliveStart(){
    this._keepAliveStop();
    this._keepAlive=setInterval(()=>{try{if(speechSynthesis.speaking&&!speechSynthesis.paused&&this.playing){/* noop */}else if(this.playing)speechSynthesis.resume();}catch(e){}},5000);
  },
  _keepAliveStop(){if(this._keepAlive){clearInterval(this._keepAlive);this._keepAlive=null;}},
  _hl(seg){
    this._clearHL();
    if(seg&&seg.el){seg.el.classList.add('tts-cur');this._hlEl=seg.el;
      seg.el.scrollIntoView({block:'center',behavior:'smooth'});}
  },
  _clearHL(){if(this._hlEl){this._hlEl.classList.remove('tts-cur');this._hlEl=null;}},
  _bar(show){const b=document.getElementById('tts-bar');if(b)b.classList.toggle('show',!!show);},
  _info(t){const i=document.getElementById('tts-info');if(i)i.textContent=t;},
  _syncBtn(){
    const t=this.playing?'⏸':'▶';
    const b1=document.getElementById('tts-playbtn');if(b1)b1.textContent=t;
    const b2=document.getElementById('rd-playbtn');if(b2)b2.textContent=this.playing?'⏸ 暂停':'▶ 朗读';
    if(this._onState)this._onState(this.playing);
  }
};
TTS.init();

/* =========================================================
   P2 沉浸阅读视图
   - 渲染 extractReadable 的章节，每段一个 <p class="rd-p tts-seg">
   - 朗读高亮直接落在段落元素上；点段落可从该处开始朗读
   - 记忆阅读位置（localStorage 按 book+scope 存 scrollTop）
   - 顶部阅读进度条随滚动前进
   ========================================================= */
const Reader={
  book:null,scope:'stage',sid:1,_segs:[],
  open(b,sid){
    this.book=b;this.sid=sid||currentStage||1;
    this.render();
    $('#reader').classList.add('show');
    this._restoreScroll();
    const secs=this._segs.map(s=>({text:s.text,el:s.el}));
    TTS.load(secs);
    document.body.style.overflow='hidden';
  },
  close(){
    TTS.stop();
    $('#reader').classList.remove('show');
    document.body.style.overflow='';
  },
  render(){
    const b=this.book;if(!b)return;
    const secs=this.scope==='book'?extractBook(b):extractReadable(b,this.sid);
    const st=STAGES.find(x=>x.id===this.sid);
    $('#rd-title').textContent=b.title;
    $('#rd-sub').textContent=this.scope==='book'?'全书阅读':`${st?st.icon+' 环节'+this.sid+' · '+st.name:''}`;
    const inner=$('#rd-inner');
    if(!secs.length){inner.innerHTML='<div class="empty">本环节还没有可阅读的内容。</div>';this._segs=[];return;}
    let html='';this._segs=[];
    secs.forEach(sec=>{
      if(sec.header){html+=`<div class="rd-sec"><div class="rs-t" style="font-size:17px">${esc(sec.t)}</div></div>`;return;}
      html+=`<div class="rd-sec"><div class="rs-t">${esc(sec.t)}</div>`;
      sec.paras.forEach(p=>{
        const i=this._segs.length;
        this._segs.push({text:p,el:null});
        const cls=sec.quote?'rd-q tts-seg':'rd-p tts-seg';
        html+=`<${sec.quote?'div':'p'} class="${cls}" data-seg="${i}">${esc(p)}</${sec.quote?'div':'p'}>`;
      });
      html+='</div>';
    });
    inner.innerHTML=html;
    $$('.tts-seg',inner).forEach(el=>{const i=+el.dataset.seg;this._segs[i].el=el;});
    this._applyFont();
  },
  toggleScope(){
    this.scope=this.scope==='book'?'stage':'book';
    this.render();this._segs.length&&TTS.load(this._segs.map(s=>({text:s.text,el:s.el})));
    $('#rd-body').scrollTop=0;
  },
  /* 字号档位 15/17/19/21 */
  FONT_SIZES:[15,17,19,21],
  _fsIdx:+(localStorage.getItem('rd_fs_idx')||1),
  font(d){
    this._fsIdx=Math.max(0,Math.min(this.FONT_SIZES.length-1,this._fsIdx+d));
    try{localStorage.setItem('rd_fs_idx',this._fsIdx);}catch(e){}
    this._applyFont();
  },
  _applyFont(){document.documentElement.style.setProperty('--rd-fs',this.FONT_SIZES[this._fsIdx]+'px');},
  _posKey(){return 'rd_pos_'+(this.book?this.book.id:'')+'_'+this.scope+'_'+this.sid;},
  _saveScroll(){try{localStorage.setItem(this._posKey(),$('#rd-body').scrollTop);}catch(e){}},
  _restoreScroll(){
    try{const v=+localStorage.getItem(this._posKey());if(v>0)$('#rd-body').scrollTop=v;}catch(e){}
  },
  /* 进度条 + 位置记忆（滚动监听在 init 里挂） */
  _onScroll(){
    const el=$('#rd-body');const h=el.scrollHeight-el.clientHeight;
    const pct=h>0?Math.min(100,el.scrollTop/h*100):100;
    const bar=$('#rd-prog-i');if(bar)bar.style.width=pct+'%';
    clearTimeout(this._st);this._st=setTimeout(()=>this._saveScroll(),250);
  },
  init(){
    $('#rd-body').addEventListener('scroll',()=>this._onScroll(),{passive:true});
    // 点段落 → 从该段开始朗读
    $('#rd-inner').addEventListener('click',e=>{
      const seg=e.target.closest('.tts-seg');if(!seg)return;
      const i=+seg.dataset.seg;
      if(TTS.playing)TTS.jumpTo(i);
      else{TTS.jumpTo(i);TTS.play();}
    });
  }
};

/* 弹窗「🔊」直接读当前环节：不开阅读视图，段元素用 stage-body 里的块做高亮 */
function ttsCurrentStage(){
  const b=getBook();if(!b)return;
  const secs=extractReadable(b,currentStage);
  const flat=[];
  secs.forEach(sec=>{if(!sec.header)sec.paras.forEach(p=>flat.push({text:(sec.t?sec.t+'。':'')+p,el:null}));});
  if(!flat.length){toast('本环节暂无可读内容');return;}
  TTS.load(flat);
  TTS.play();
}
